h1:Ch 1 & 17 - The Holy Bible & The Canon of the Bible
================================================================
h2:Introduction
h4:The Old Testament
ip: ~u~39 books (Genesis to Malachi)~u~
ip: Creation, fall of man, hope of redemption
ip: God intervened regularly in the lives of Israelites
ip: End with the hope of a Saviour, the Messiah (Christ), who would come to save His people
ip: Spans from BC 2000 to BC 450

h4:The New Testament
ip: ~m~27 books (St. Matthew to Revelations) ~m~
ip: Gospels - Birth of Christ to his resurrection
ip: Acts of Apostles - Establishment of the church
ip: Romans till Jude - Letters / Epistles
ip: Revelations - Apocalyptic Literature
ip: Spans from BC 5 till about AD 100

h2:Pentateuch / Torah
Pentateuch (Greek meaning ~u~’Five scrolls’~u~) or / Torah (Hebrew meaning ~u~’Law’~u~) are the ~u~first five books~u~ of the Bible. ~m~Authorship ascribed to Moses~m~. Moses was the head of prophets and liberator of Israelites from Egypt.

~b~Genesis~b~ - God called Abraham - asked him to go away from his homeland. God appeared to Abraham and instructed him. God spoke to his successors - Isaac, Jacob, Joseph. Creation till the life of Israelites in Egypt.

~b~Exodus~b~ - Tribulations in Egypt. God called Moses. Liberation from Egypt. God’s covenant on Mount Sinai (Ten Commandments)

~m~~b~Leviticus~b~ - Sacrifices & offerings made to God~m~

~b~Numbers~b~ - Enumeration of the people

~b~Deuteronomy~b~ - Farewell speeches of Moses, reiteration of the covenant with God and the laws to be obeyed

h2:Historical Books
~b~Joshua~b~ - After Moses, Joshua led Israel into the promised land, where they settled down as a nation. After that Joshua judged Israel

~b~Judges~b~ - The history of Israel during the period of Judges after Joshua, from Othniel. Notable judges - Gideon, Samson

~b~Ruth~b~

~b~1 & 2 Samuel~b~ - Eli as judge. Succeeded by Samuel, the last judge. Israel rejection of Theocracy (God as King). First King - Saul. David becomes King,

~b~1 & 2 Kings~b~ - King Solomon builds the temple. Solomon sins. ~m~God divides Israel into Israel (Northern Kingdom) and Judah (Southern Kingdom).~m~ Israel was captured by Assyrians. Judah goes into exile into Babylon (King Nebuchadnezzar).

~b~1 & 2 Chronicles~b~ - ~m~Repetition of the events in Samuel / Kings along with a number of Genealogies.~m~

~b~Ezra and Nehemiah~b~ - Return from Babylonian exile. Thus the books till Nehemiah deal with the history of Israel till 450 BC.

~b~Esther ~b~

h2:Wisdom Books
~b~Job~b~

~b~Psalms ~b~ - It’s a collection of Hebrew Jewish Hymns. Mostly attributed to King David. There are also other authors. There are 150 psalms. The numbering in the Bible and our prayer books may be slightly different

~b~Proverbs ~b~ - Written by King Solomon. Teaches “The fear of God (meaning submission to the will of God) is the beginning of wisdom”.

~b~Ecclesiastes ~b~ - Written by King Solomon.

~b~Song of Songs ~b~ - Written by King Solomon.

~b~Prophets ~b~ - Prophets from Isaiah till Malachi gave instructions to people to return to the path of righteousness whenever they went astray. The prophets laboured to bring them back to a moral life based on the covenant.

h2:The Canon of the Bible
~m~Canon (greek) - literally ‘~u~measuring rod~u~’ - technically means ‘~u~Rules or criteria~u~’~m~

~m~The canon of the Bible refers to the ~u~principles by which the books are included~u~ in it~m~

~m~The canon of the Bible was evolved and established through a long period of time.~m~

~m~Several books were progressively added to the Holy Bible before the Bible we have today was finally established and confirmed~m~

h3:Criteria employed to include a book in the Canon
~u~The author should be an accepted ‘man / woman of God’~u~

~u~The content should be beneficial to the faith and order of one’s life. It should be in harmony with similar books~u~

~u~It should have been used in worship and should have general acceptance~u~

~u~It should generate thoughts of God in the believers, and lead them to God~u~

h2:The Old Testament Canon
The word ‘canon’ was not used during the Old Testament period. There were ~u~two canons of the bible followed by the Jewish community~u~

h3:The Hebrew Bible
~m~The Hebrew Bible had 39 books. These were integrated into 20 books. It’s called Ta Na K ~m~

~u~Torah (The Law)~u~ - Genesis, Exodus, Leviticus, Numbers, Deuteronomy

~m~Nebim (The Prophets)~m~ - Joshua, Judges, Samuel, Kings, Isaiah, Jeremiah, Ezekiel, The Twelve (Minor Prophets)

~u~Kethubim (The Scriptures / The Writings)~u~ - Psalms, Proverbs, Job, Song of Songs, Ruth, Lamentations, Ecclesiastes, Esther, Daniel, Ezra, Nehemiah, Chronicles

h3:~m~Septuagint (LXX)~m~
Referred to as “~u~The Greek Old Testament~u~” or “~u~The Translation of the Seventy~u~”

“The laws of the Jews“ were translated into the Greek language at the request of Ptolemy II Philadelphus (285–247 BC) by seventy scholars.

The first five books of the Hebrew Bible were translated from Biblical Hebrew into Koine Greek by Jews living in the Ptolemaic Kingdom, probably in the third century BC.

The remaining books were translated by the 2nd century AD.

Before the 3rd century BC, a large number of Jews migrated to Alexandria. The later generations didn’t know Hebrew. And they followed Septuagint.

h3:Deutero - Canonical books
~u~The LXX had 7 more books (39 + 7 = 46).~u~

~u~Deutero - canonical - A secondary canon~u~

Protestants refer it as Apocrypha (meaning ‘hidden’ - outside accepted canon)

Tobit, Judith, 1 & 2 Maccabees, Wisdom of Solomon etc.

h3:~m~Council at Jamnia~m~
The rabbis & scholars of Judaism wanted ~u~to prevent the spread of Christianity~u~

Assembled at Jamnia (AD 90)

~u~Rejected the Alexandrian Canon of the Bible used by the Christian church~u~

The number of books of the Bible was fixed at 39

~m~The Orthodox and Catholic churches accept all 46 books ~m~

Jews and Protestants accept only 39 books

h3:Peshitho
Peshitho is the ~u~Syriac Bible~u~

~u~Malankara Orthodox Church recommends the use of “Peshitho”~u~

~m~Malayalam translations of Peshitho are available. The first translation done in 1811 (Ramban Philipose, Ramban Ittoop Pulikkottil and linguist Thinmaya Pillai) ~m~

The peshitho also contains some of the Deuterocanonical books found in LXX

h2:New Testament Canon
The canon of the New Testament was also established through progressive recognition.

All 27 books in the New Testament were written in the 1st century AD.

By 2nd century AD, several other books came into currency - authored by heretics to propagate their theories. This caused confusion among believers

So, the establishment of a New Testament canon became a necessity.

Christians thought that, like Jews, they too needed authoritative texts and a canon to follow

h3:New Testament books
Based on the criteria, the first books to be recognised were

The four gospels

Acts of Apostles

Thirteen epistles attributed to St. Paul

Nine books - subsequently & progressively admitted - Hebrews, James, Jude, Revelations, 1 & 2 Peter, 1, 2 & 3 John

~m~The first person to prepare a list of the New Testament books was a heretic named Maricon.~m~

The early church fathers have listed the New Testament books in their writings. Example. St. Athanasius, bishop of Alexandria, Pastoral letter - AD 365 listed all 27 books. ~m~However, in the list of St. Cyril of Jerusalem, the Book of Revelations is excluded.~m~

h3:~m~Classification of the New Testament books~m~
The four gospels - The gospel is the good news that Jesus Christ, the Son of God, died for our sins and rose again, eternally triumphant over his enemies, so that there is now no condemnation for those who believe, but only everlasting joy. The gospels contain events from the birth of Jesus till his Ascension.

Historical book - Acts of Apostles - Events that succeeded the ascension of Jesus Christ. The Holy Spirit comes on the day of Pentecost. Founding & development of the church in Judah and Jerusalem and other parts of the world

Epistles - Romans to Jude

Apocalyptic Literature - Revelation

h3:The Holy Church & The Holy Bible
The Great General councils did not take any decisions regarding the canon of the Holy Bible.

The canon of the Bible is defined in certain local councils

~u~It is the Holy Church that has given us the Holy Bible.~u~

The church has weighed the authority of a particular book and has declared it to be part of the canon.

~u~At the same time, the role of the Holy Bible in regulating the faith of the church and the life of the believers is unique and primary.~u~

~u~The church existed before the bible came into existence.~u~

h2:Ch 1 - Quiz

1. How many books make up the Old Testament canon accepted by the Orthodox Church?
tq:A. 27 || B. 39 || C. 46 || D. 66
aa:C. 46 \n\nOrthodox Old Testament includes 39 + 7 Deutero-canonical books

2. What overarching timeline does the Old Testament span?
t5:A. BC 4000 to BC 1000 || B. BC 2000 to BC 450
t5:C. BC 1000 to AD 33   || D. BC 450 to AD 100
aa:B. BC 2000 to BC 450. \n\nFrom around 2000 BC (the time of Abraham) down to about 450 BC (the time of Ezra and Nehemiah)

3. What is the central message or hope with which the Old Testament concludes?
t5:A. The physical rebuild of the Temple              || B. The destruction of the Roman Empire
t5:C. The hope of a Savior, the Messiah (Christ)      || D. The establishment of the synagogue system
aa:C. The hope of a Savior, the Messiah (Christ) \n\nThe Old Testament ends pointing forward to the arrival of the promised Messiah who would save His people

4. What timeframe does the New Testament span?
A) BC 2000 to BC 450
B) BC 450 to AD 33
C) BC 5 to about AD 100
D) AD 33 to AD 325
aa:C) BC 5 to about AD 100 \n\nThe New Testament covers events from the birth of Christ (c. 5 BC) through the apostolic age ending around AD 100

5. Which section of the New Testament details the founding and growth of the early Church?
A) The Gospels
B) Acts of the Apostles
C) The Epistles (Romans to Jude)
D) Revelation
aa:B) Acts of the Apostles \n\n The Book of Acts records the Holy Spirit\'s arrival at Pentecost and the subsequent spread and establishment of the Church.

6. The word "Pentateuch" comes from Greek and literally means:
A) Five scroll containers
B) Five scrolls
C) Five laws
D) Five books of Moses
aa:Answer: B) Five scrolls \n\nExplanation: \'Pentateuch\' comes from the Greek terms meaning \'five scrolls\'

7. What is the Hebrew term "Torah" translated as in English?
A) Covenant
B) Writings
C) Law
D) Instructions of Prophets
aa:C) Law \n\nExplanation: Torah is the Hebrew word for Law or instruction, referring to the first five books of the Hebrew Bible.

8. Authorship of the first five books of the Bible is traditionally ascribed to:
A) Abraham
B) Joshua
C) Moses
D) Samuel
aa:C) Moses \n\nExplanation: Moses is recognized as the head of the prophets and the traditional author of the Pentateuch.

9. Which book covers events from Creation up to the life of the Israelites in Egypt?
A) Genesis
B) Exodus
C) Leviticus
D) Numbers
aa:A) Genesis \n\nExplanation: Genesis narrates Creation, the Fall, the Patriarchs (Abraham, Isaac, Jacob, Joseph), and ends with Israel in Egypt.

10. The giving of the Ten Commandments on Mount Sinai is recorded in which book?
A) Genesis
B) Exodus
C) Leviticus
D) Deuteronomy
aa:Answer: B) Exodus \n\nExplanation: Exodus details Israel\'s deliverance from Egyptian bondage and God establishing His covenant on Mount Sinai.

11. Which Pentateuchal book is primarily focused on sacrifices and offerings made to God?
A) Exodus
B) Leviticus
C) Numbers
D) Deuteronomy
aa:Answer: B) Leviticus \n\nExplanation: Leviticus sets forth the ritual laws, priesthood responsibilities, sacrifices, and offerings required by God.

12. The book of Deuteronomy is best described as:
A) An enumeration/census of the Israelite population
B) A collection of Jewish hymns and prayers
C) Farewell speeches of Moses reiterating the covenant and laws
D) A chronicle of the military conquest of Canaan
aa:Answer: C) Farewell speeches of Moses reiterating the covenant and laws \n\nExplanation: Deuteronomy consists of Moses\' final addresses to the Israelites before they enter the Promised Land, renewing their covenant with God.

13. Who led the Israelites into the Promised Land following the death of Moses?
A) Gideon
B) Samuel
C) Joshua
D) Caleb
aa:Answer: C) Joshua \n\nExplanation: Joshua succeeded Moses, led Israel across the Jordan into the Promised Land, and judged Israel afterwards.

14. Who were two notable leaders during the era of the Judges mentioned in the text?
A) Moses and Caleb
B) Gideon and Samson
C) Saul and Samuel
D) Ezra and Nehemiah
aa:Answer: B) Gideon and Samson \n\nExplanation: Gideon and Samson are among the key judges who delivered Israel from regional oppressors during the judges\' era.

15. Who was the last judge of Israel before the monarchy was established?
A) Eli
B) Samuel
C) Othniel
D) Samson
aa:Answer: B) Samuel \n\nExplanation: Samuel succeeded Eli and served as the final judge before anointing Israel\'s first kings.

16. The demand of the Israelites for a human king was viewed as a rejection of:
A) The Law of Moses
B) Theocracy (God as King)
C) The priesthood of Aaron
D) The covenant of Abraham
aa:Answer: B) Theocracy (God as King) \n\nExplanation: Requesting an earthly monarch was a rejection of direct divine rule (theocracy), where God Himself reigned over Israel.

17. Who was anointed as the first king of Israel?
A) David
B) Solomon
C) Saul
D) Rehoboam
aa:Answer: C) Saul \n\nExplanation: Saul was selected and anointed by Samuel as Israel\'s first monarch.

18. Following the sin of King Solomon, the kingdom divided into:
A) Northern Kingdom (Judah) and Southern Kingdom (Israel)
B) Northern Kingdom (Israel) and Southern Kingdom (Judah)
C) Eastern Kingdom (Syria) and Western Kingdom (Samaria)
D) Judea and Galilee
aa:Answer: B) Northern Kingdom (Israel) and Southern Kingdom (Judah) \n\nExplanation: The United Monarchy split into the Northern Kingdom (Israel) and the Southern Kingdom (Judah).

19. The Northern Kingdom of Israel was captured by the:
A) Babylonians
B) Assyrians
C) Persians
D) Romans
aa:Answer: B) Assyrians \n\nExplanation: The Assyrians conquered the Northern Kingdom of Israel and carried its population into exile.

20. Which kingdom was taken into exile by King Nebuchadnezzar of Babylon?
A) Judah (Southern Kingdom)
B) Israel (Northern Kingdom)
C) Edom
D) Moab
aa:Answer: A) Judah (Southern Kingdom) \n\nExplanation: King Nebuchadnezzar of Babylon invaded and exiled the Southern Kingdom of Judah.

21. Which historical books record the return of the Jewish exiles from Babylon up to ~450 BC?
A) 1 & 2 Kings
B) 1 & 2 Samuel
C) Ezra and Nehemiah
D) Joshua and Judges
aa:Answer: C) Ezra and Nehemiah \n\nExplanation: Ezra and Nehemiah detail the restoration of the Jewish community, the rebuilding of Jerusalem, and the conclusion of OT history around 450 BC.

22. According to Proverbs, what is the beginning of wisdom?
A) Extensive study of the Law
B) The fear of God
C) Listening to the elders of the city
D) Living an ascetic lifestyle
aa:Answer: B) The fear of God \n\nExplanation: Proverbs teaches that reverence and submission to God\'s will (\'the fear of God\') is the true starting point of all wisdom.

23. How many Psalms are contained in the biblical collection?
A) 120
B) 150
C) 70
D) 66
aa:Answer: B) 150 \n\nExplanation: The Book of Psalms contains 150 Hebrew Jewish hymns, primarily attributed to King David among other authors.

24. Which three Wisdom books are traditionally attributed to King Solomon in the text?
A) Job, Psalms, Proverbs
B) Proverbs, Ecclesiastes, Song of Songs
C) Psalms, Job, Wisdom of Solomon
D) Job, Proverbs, Ecclesiastes
aa:Answer: B) Proverbs, Ecclesiastes, Song of Songs \n\nExplanation: King Solomon is traditionally recognized as the author of Proverbs, Ecclesiastes, and Song of Songs.

25. What was the primary mandate given to the Prophets from Isaiah to Malachi?
A) To write historical records of the kings
B) To instruct people to return to righteousness and the covenant
C) To collect temple taxes and administer sacrifices
D) To translate Hebrew scriptures into foreign languages
aa:Answer: B) To instruct people to return to righteousness and the covenant \n\nExplanation: The prophets called the nation back to moral living and faithfulness to their covenant with God whenever they strayed.

26. The word Canon originates from a Greek word meaning:
A) Sacred parchment
B) Inspired speech
C) Measuring rod (rules or criteria)
D) Holy library
aa:Answer: C) Measuring rod (rules or criteria) \n\nCanon comes from the Greek term for a measuring rod or standard, denoting the official criteria for accepting books into Scripture.

27. What does the acronym TaNaKh stand for in Hebrew tradition?
A) Torah, Nebim, Kethubim
B) Torah, Nevi'im, Pentateuch
C) Tobit, Nehemiah, Kings
D) Torah, Nebuchadnezzar, Kethubim
aa:Answer: A) Torah, Nebim, Kethubim \n\nExplanation: Torah (Law), Nebim (Prophets), and Kethubim (Writings) form the tripartite acronym TaNaKh.

28. In the Jewish division of the Hebrew Bible, the books of Joshua, Judges, Samuel, and Kings are placed under:
A) Torah (The Law)
B) Nebim (The Prophets)
C) Kethubim (The Scriptures / The Writings)
D) Apocrypha
aa:Answer: B) Nebim (The Prophets) \n\nExplanation: These books are categorized as the \'Former Prophets\' within the Nebim section of the Hebrew Bible.

29. The Septuagint (LXX) is best known as:
A) The original Hebrew text of the Torah
B) The Greek translation of the Old Testament
C) The Aramaic paraphrase of the Prophets
D) The Syriac translation of the New Testament
aa:Answer: B) The Greek translation of the Old Testament \n\nExplanation: The Septuagint (LXX) is the ancient Greek translation of the Old Testament Scriptures.

30. According to tradition, the translation of the Torah into Koine Greek was requested by:
A) King Nebuchadnezzar
B) Ptolemy II Philadelphus
C) Alexander the Great
D) Emperor Constantine
aa:Answer: B) Ptolemy II Philadelphus \n\nExplanation: King Ptolemy II Philadelphus (285–247 BC) requested the translation of the Jewish Law into Greek for the Library of Alexandria.

31. Why was the Septuagint necessary for Jewish communities in Alexandria by the 3rd century BC?
A) Hebrew manuscripts had been destroyed in the exile
B) Later generations living in Alexandria spoke Greek and did not know Hebrew
C) The Greek government made reading Hebrew illegal
D) The Temple priests commanded everyone to use Greek
aa:Answer: B) Later generations living in Alexandria spoke Greek and did not know Hebrew \n\nExplanation: As Jewish communities assimilated into the Hellenistic world, subsequent generations adopted Greek and lost fluency in Hebrew.

32. How many additional books are included in the Septuagint (LXX) canon compared to the Hebrew Bible?
A) 5
B) 7
C) 12
D) 14
aa:Answer: B) 7 \n\nExplanation: The LXX contains 7 additional books (46 books in total), known as the Deuterocanonical books.

33. What term do Protestants use to refer to the Deuterocanonical books?
A) Pseudepigrapha
B) Apocrypha (meaning 'hidden')
C) TaNaKh
D) Eschatologia
aa:Answer: B) Apocrypha (meaning \'hidden\') \n\nExplanation: Protestants designate these books as Apocrypha, placing them outside the accepted 39-book Hebrew canon.

34. At which council in AD 90 did Jewish rabbis assemble to fix the Hebrew canon at 39 books?
A) Council of Nicaea
B) Council of Jamnia
C) Council of Jerusalem
D) Council of Alexandria
aa:Answer: B) Council of Jamnia \n\nExplanation: Rabbis convened at the Council of Jamnia (~AD 90) and affirmed a 39-book Hebrew canon.

35. What is the 'Peshitho'?
A) The Latin Vulgate Bible
B) The Syriac Bible
C) The Coptic translation of the Gospels
D) The Ethiopic Old Testament
aa:Answer: B) The Syriac Bible \n\nExplanation: The Peshitho is the traditional Syriac version of the Holy Bible.

36. In what year was the first Malayalam translation of the Peshitho published in Kerala?
A) 1599
B) 1811
C) 1901
D) 1947
aa:Answer: B) 1811 \n\nExplanation: The initial Malayalam translation of the Peshitho was produced in 1811 by Ramban Philipose, Ramban Ittoop Pulikkottil, and Thinmaya Pillai.

37. Who was the heretic who prepared the first restricted list of New Testament books, prompting the Church to formalize its canon?
A) Arius
B) Marcion
C) Pelagius
D) Nestorius
aa:Answer: B) Marcion \n\nExplanation: Marcion created an altered, selective list of texts, which compelled the early Church to formally define its official New Testament canon.

38. Which Church Father listed all 27 New Testament books in his Pastoral Letter of AD 365?
A) St. Cyril of Jerusalem
B) St. Athanasius of Alexandria
C) St. John Chrysostom
D) St. Augustine of Hippo
aa:Answer: B) St. Athanasius of Alexandria \n\nExplanation: St. Athanasius, Bishop of Alexandria, explicitly listed the 27 books of the New Testament in his Easter/Pastoral Letter of AD 365.

39. Which book was excluded from the New Testament list compiled by St. Cyril of Jerusalem?
A) Hebrews
B) James
C) Revelation
D) 2 Peter
aa:Answer: C) Revelation \n\nExplanation: St. Cyril of Jerusalem omitted the Book of Revelation from his canon list.

40. What is the historical relationship between the Church and the Bible?
A) The Bible existed first, and the Church was established by reading it
B) The Church existed before the Bible came into existence and declared its canon
C) The Great General Councils compiled the official list of the New Testament books
D) The Old Testament was compiled after the New Testament was completed
aa:Answer: B) The Church existed before the Bible came into existence and declared its canon \n\nExplanation: The Church lived, worshipped, and spread for decades before the New Testament books were written and progressively recognized into a single canon.

41. How many books in total make up the New Testament?
A) 39
B) 27
C) 46
D) 14
aa:Answer: B) 27 \n\nExplanation: The New Testament consists of 27 books (written between the birth of Christ and ~100 AD), comprising Gospels, Acts, Epistles, and Revelation.

42. Which specific Old Testament historical books record the division of the kingdom into the Northern Kingdom (Israel) and Southern Kingdom (Judah)?
A) 1 & 2 Samuel
B) 1 & 2 Kings
C) Ezra & Nehemiah
D) Joshua & Judges
aa:Answer: B) 1 & 2 Kings \n\nExplanation: 1 & 2 Kings record King Solomon’s reign, his sin, and the subsequent split of the united kingdom into Israel and Judah.

43. What was the primary goal of the Jewish rabbis and scholars assembling at the Council of Jamnia in AD 90?
A) To translate the Old Testament into Syriac
B) To prevent the spread of Christianity and fix the Hebrew canon
C) To add seven new books to the Alexandrian Canon
D) To authorize the use of the Septuagint in synagogues
aa:Answer: B) To prevent the spread of Christianity and fix the Hebrew canon \n\nExplanation: The Council of Jamnia rejected the Alexandrian (Greek) canon used by Christians and fixed the Jewish canon at 39 books to safeguard Judaism against Christian teachings.

44. Who first translated the Peshitho Bible into Malayalam?
A. Parumala Thirumeni and Vattasseril Thirumeni
B. Konaattu Abraham Malpan
C. Ramban Philipose, Ramban Ittoop Pulikkottil and Thinmaya Pillai
D. Marthoma First
aa:Answer C. Ramban Philipose, Ramban Ittoop Pulikkottil and Thinmaya Pillai \n\nExplanation: The first Malayalam translation of the Syriac Peshitho Bible was published in 1811 through the joint efforts of Ramban Philipose, Ramban Ittoop Pulikkottil, and linguist Thinmaya Pillai.

45. Into which four categories are the 27 books of the New Testament categorized?
A) Law, History, Epistles Prophets
B) Gospels, History, Epistles, Apocalyptic Literature
C) Pentateuch, Wisdom, Prophets, Apocalyptic Literature
D) Torah, Nebim, Kethubim, Apocrypha
aa:Answer: B) Gospels, Historical Book (Acts), Epistles, Apocalyptic Literature (Revelation) \n\nExplanation: The New Testament is structured into the 4 Gospels, 1 Historical book (Acts), 21 Epistles (Romans to Jude), and 1 Apocalyptic book (Revelation).

46. How did the Canon of the Holy Bible come into existence?
A) It was discovered as a single complete book in a cave
B) It was defined by a direct decree from a Great General Council
C) It was evaluated, declared, and established by the Holy Church over time
D) It was translated directly from Greek by King Ptolemy II
aa:Answer: C) It was evaluated, declared, and established by the Holy Church over time \n\nExplanation: The text states that the Church existed before the Bible; the Church weighed the authority of each book and declared it part of the canon through progressive recognition.


h1:Ch 2 - Inter Testament History
============================================
h2:Medo-Persian Empire ~ 550 - 332 BC

~b~Cyrus the Great ~ 550-530 BC~b~

ip:~m~538 BC - King Cyrus issues a decree permitting Jews to return to Jerusalem~m~

ip:~m~Ezra, Nehemiah, Joshua, the priest, Zerubbabel - leadership to restoration~m~: This is the Second Temple of Jerusalem

ip:Restoration of Jerusalem Temple - Books of Haggai, Zechariah, Ezra, Nehemiah

~m~~b~Darius the Great ~ 521-486 BC~b~

ip: ~m~ Second Temple completed in 515 BC - Ezra 6:15

~b~Return from exile~b~

&emsp; During Parsi Kings (538-332 BC), Jews in Babylonian exile returned to Jerusalem

&emsp; Ref: Book of Maccabees, Josephus, Philo of Alexandria (1st Century AD)

h2:The Greek Period ~ 333 - 63 BC
BC 333 - Alexander of Macedonia defeated the Parsis and founded a vast empire

BC 323 - Alexander dies in Babylon. Kingdom divided among his four generals, of whom we will study about
&emsp; - Ptolemy in Egypt
&emsp; - Seleucus in Middle East & Central Asia

h2:Maccabees
~b~1 Maccabees 1:1-3,5,6,8 (The death of Alexander):~b~ 1 After Alexander son of Philip, the Macedonian, who came from the land of Kittim, had defeated King Darius of the Persians and the Medes, he succeeded him as king. (He had previously become king of Greece.) 2 He fought many battles, conquered strongholds, and slaughtered the kings of the earth. 3 He advanced to the ends of the earth and plundered many nations. When the earth became quiet before him, he was exalted, and his heart was lifted up. 5 After this he fell sick and perceived that he was dying. 6 So he summoned his most honored officers, who had been brought up with him from youth, and divided his kingdom among them while he was still alive. 8 Then his officers began to rule, each in his own place

Incessant wars between the Ptolemaic & the Seleucid empires, the two largest empires issued from Alexander the Great’s conquest of the Persian Empire. Judah & Egypt were under the Ptolemies from 305 BC - 198 BC

Ptolemy II Philadelphus (Son of Ptolemy I - 284 to 246 BC) - promoted the Library of Alexandria - 72 Jewish scholars translated Hebrew Bible into Greek - Septuagint (LXX)

198 BC - The Battle between Seleucid forces led by Antiochus III and Ptolemaic forces. The Seleucids win the battle which allows Antiochus III to obtain entire possession of Palestine region from King Ptolemy V of Egypt. But he did not occupy Egypt.

King Antiochus III the Great (ruled 223 - 187 BC) allowed Jews to live according to their own scriptures. Josephus writes that he also gave financial aid towards this

King Antiochus IV ascended to throne in 175 BC. King Antiochus IV (ruled 175-164 BC) religiously persecuted the Jews. Onias III was the high priest of Israel - a pious man (from 198/197 BC to 175 BC). Jason, the brother of Onias bribed the King and became the High Priest of Jerusalem (2 Maccabees 4:7-10). King also wanted to capture the wealth of the Temple of Jerusalem as he was massive need of money. Jason tried to spread Greek culture in Jerusalem. He built a gymnasium right next to the Temple. Encouraged the priests to neglect the sacrifices in favor of discus throwing and Greek wrestling.

In 172 BC, Menelaus bribed Antiochus and became the high priest. Menelaus wasn’t even from the high-priestly family. He was a cruel tyrant (2 Maccabees 4:24-25). When he couldn’t raise the massive money he promised the King, he started stealing gold vessels from the Temple to sell them. And also for his personal needs. Onias III publicly rebuked him for this sacrilege. So, he plotted and had Onias III killed (171 BC).

~b~1 Maccabees 1:10, 16-19 (Antiochus IV defeats Ptolemy VI - BC 170):~b~ 10 From them came forth a sinful root, Antiochus Epiphanes, son of King Antiochus; he had been a hostage in Rome. He began to reign in the one hundred thirty-seventh year (175 BC) of the kingdom of the Greeks.16 When Antiochus saw that his kingdom was established, he determined to become king of the land of Egypt, in order that he might reign over both kingdoms. 17 So he invaded Egypt with a strong force, with chariots and elephants and cavalry and with a large fleet. 18 He engaged King Ptolemy of Egypt in battle, and Ptolemy turned and fled before him, and many were wounded and fell. 19 They captured the fortified cities in the land of Egypt, and he plundered the land of Egypt.

~b~1 Maccabees 1:20-24 (on Return from Egypt - Antiochus Loots the Temple):~b~ 20 After subduing Egypt, Antiochus turned back in the one hundred forty-third year (169 BC) and went up against Israel and came to Jerusalem with a strong force. 21 He arrogantly entered the sanctuary and took the golden altar, the lampstand for the light, and all its utensils. 22 He took also the table for the bread of the Presence, the cups for drink offerings, the bowls, the golden censers, the curtain, the crowns, and the gold decoration on the front of the temple; he stripped it all off. 23 He took the silver and the gold and the costly vessels; he took also the hidden treasures that he found. 24 Taking them all, he went into his own land.

~b~1 Maccabees 1:29-33 (2 Yrs later - Antiochus destroys the walls of the Temple - Makes it their fortress):~b~ 29 Two years later the king sent to the cities of Judah a chief collector of tribute, and he came to Jerusalem with a large force. 30 Deceitfully he spoke peaceable words to them, and they believed him, but he suddenly fell upon the city, dealt it a severe blow, and destroyed many people of Israel. 31 He plundered the city, burned it with fire, and tore down its houses and its surrounding walls. 32 They took captive the women and children and seized the livestock. 33 Then they fortified the city of David with a large strong wall and strong towers, and it became their citadel.

~b~1 Maccabees 1:54-56 (Sacrilege on the Altar and temple dedicated to Zeus):~b~ 54 Now on the fifteenth day of Chislev, in the one hundred forty-fifth year (167 BC), they erected a desolating sacrilege on the altar of burnt offering. They also built altars in the surrounding towns of Judah 55 and offered incense at the doors of the houses and in the streets. 56 The books of the law that they found they tore to pieces and burned with fire.

h3:~m~Maccabean Revolt & Hanukkah~m~
Jews under Mattathias & his sons revolted against the desecration of the Temple and Jewish religion

The sons of Mattathias (Hasmonean tribes) under the leadership of Judas Maccabeus (“the hammer”) defeated the troops of Antiochus IV in BC 164

They reclaimed the Temple & rededicated it to God

This rededication of the Temple was in later Jewish history celebrated as a Feast called ‘Hanukkah’

h3:Hasmonean Dynasty
Judas Maccabees son of Mattathias (167 - 160 BC)

Jonathan son of Mattathias (160 - 143 BC)

During the reign of Simon, son of Mattathias (142-134 BC), the threat of foreign invasion dissipated

The first book of Maccabees ends with death of Simon and the succession of his son John Hyrcanus (reign 134 - 104 BC)

The Hasmonean (Hasidim) dynasty ruled in Israel till BC 63 surviving the threat of various foreign powers like the seleucids and Romans

The Hasmonean rulers were priests, administrators and military generals of Israel at the same time

It was during their period that social groups like Sadducees, Pharisees etc. originated in the Jewish community

John Hyrcanus ⇒ His son Aristobulus I (104 to 103 BC - First Hasmonean King) ⇒ His brother Alexander Jannaeus (103 to 76 BC)

Alexander named Queen Salome Alexandra (76 to 67 BC) as the successor - Second woman ruler of Israel after Athaliah

h2:Roman Rule
Hyrcanus II ruled from 67 to 66 as King. He was overthrown by his brother Aristobulus II - 66 to 63 BC as King

Both sought the help of Roman general Pompey. Pompey favoured weaker Hyrcanus over Aristobulus. Hyrcanus restored as High priest. And Israel comes under Roman rule

Hyrcanus was helped by Antipater the Idumean (Edomites are sons of Esau) as he preferred a weak Hyrcanus. Antipater (father of Herod the Great) controlled everything.

Antigonus II Mattathias (40-37 BC) conquered Jerusalem with the help of Parthians and became King. He was the last Hasmonean King

Herod fled to Rome, where on the recommendation of Mark Antony, Roman Senate proclaimed him king (40 BC).

37 BC, Herod conquers Jerusalem & wiped out Hasmonean family including Hyrcanus II.

Herod ruled till his death in 4 BC (Jesus born).

Greatest contribution - Reconstruction of Jerusalem Temple. Started in BC 20 and took 46 years to complete. It’s sometimes referred to as Herod’s Temple

After Herod, Augustus Caesar appoints his 3 sons and Herod’s sister as Tetrarchs
&emsp; - Herod Archelaus, Tetrarch of Judea, Idumea & Samaria. He was cruel. Deposed in AD 6
&emsp; - Herod Antipas (4 BC - 39 AD) - Tetrarch of Galilee and Perea
&emsp; - Philip The Tetrarch (4 BC - 34 AD)
&emsp; - Salome I (4 BC - 10 AD)


In Judea, after Archelaus was deposed in AD 6,
&emsp; - Seven non-Jewish governors from AD 6 to AD 41
&emsp; - Pontius Pilate - Governor from AD 26 to AD 36

h2:Ch 2 - Quiz

1. In 538 BC, which Parsi (Medo-Persian) king issued a decree permitting the Jews to return to Jerusalem?
A) Darius the Great
B) Antiochus III
C) Cyrus the Great
D) Alexander the Great
aa:Answer: C) Cyrus the Great \n\nExplanation: King Cyrus issued the decree in 538 BC, allowing Jewish exiles to return and rebuild Jerusalem.

2. Who provided leadership to the restoration and the building of the Second Temple of Jerusalem?
A) Mattathias, Judas Maccabeus, and Jonathan
B) Onias III, Jason, and Menelaus
C) Ezra, Nehemiah, Joshua the priest, and Zerubbabel
D) Herod the Great and Pontius Pilate
aa:Answer: C) Ezra, Nehemiah, Joshua the priest, and Zerubbabel \n\nExplanation: Leadership for the restoration of Jerusalem and the Temple came through figures like Ezra, Nehemiah, Joshua the priest, and Zerubbabel.

3. During the reign of which king was the Second Temple of Jerusalem completed?
A) Cyrus the Great
B) Darius the Great
C) Antiochus IV Epiphanes
D) Ptolemy II Philadelphus
aa:Answer: B) Darius the Great \n\nExplanation: Darius the Great (ruled ~521–486 BC) reigned when the Second Temple was completed in 515 BC (Ezra 6:15).

4. In what year was the Second Temple of Jerusalem completed?
A) 538 BC
B) 515 BC
C) 333 BC
D) 164 BC
aa:Answer: B) 515 BC \n\nExplanation: The Second Temple was finished in 515 BC, as recorded in Ezra 6:15.

5. Following the death of Alexander the Great in 323 BC, his empire was divided among four generals. Which two general dynasties ruled the Middle East/Central Asia and Egypt, heavily impacting Jewish history?
A) Caesar and Pompey
B) Cyrus and Darius
C) Seleucus and Ptolemy
D) Herod and Antipater
aa:Answer: C) Seleucus and Ptolemy \n\nExplanation: Alexander’s kingdom was divided among generals including Ptolemy (in Egypt) and Seleucus (in the Middle East & Central Asia).

6. Which Seleucid ruler severely persecuted the Jews, looted the Temple, erected a 'desolating sacrilege' (altar to Zeus) in 167 BC, and tried to force Greek culture upon Jerusalem?
A) Antiochus III the Great
B) Seleucus IV
C) Antiochus IV Epiphanes
D) Ptolemy II Philadelphus
aa:Answer: C) Antiochus IV Epiphanes \n\nExplanation: Antiochus IV religious persecution, temple looting, and placement of an altar to Zeus on the altar of burnt offering triggered the Maccabean revolt.

7. What historical event is celebrated in Jewish history as the Feast of 'Hanukkah'?
A) The completion of the First Temple by Solomon
B) The return of the exiles from Babylon under Cyrus
C) The reclamation and rededication of the Temple by Judas Maccabeus in 164 BC
D) The translation of the Septuagint in Alexandria
aa:Answer: C) The reclamation and rededication of the Temple by Judas Maccabeus in 164 BC\n\nExplanation: Hanukkah commemorates the victory of Mattathias's family and Judas Maccabeus over Antiochus IV\'s troops, and the rededication of the defiled Temple to God.

8. Which social and religious groups originated within the Jewish community during the period of the Hasmonean Dynasty?
A) Pharisees and Sadducees
B) Essenes and Zealots
C) Levites and Nazirites
D) Scribes and Herodians
aa:Answer: A) Pharisees and Sadducees \n\nExplanation: The Hasmonean rulers served simultaneously as priests, administrators, and military generals, during whose era groups like the Sadducees and Pharisees emerged.

9. What was the greatest contribution of Herod the Great, who was proclaimed King of Judea by the Roman Senate in 40 BC?
A) The writing of the Book of Maccabees
B) The translation of the Peshitho Bible
C) The massive reconstruction of the Jerusalem Temple (Herod's Temple)
D) The defeat of General Pompey
aa:Answer: C) The massive reconstruction of the Jerusalem Temple (Herod\'s Temple) \n\nExplanation: Herod\'s most notable project was rebuilding the Jerusalem Temple, which began in 20 BC and took 46 years to complete.

10. Who was the Roman governor of Judea during the active ministry and crucifixion of Jesus Christ (AD 26 to AD 36)?
A) Pontius Pilate
B) Herod Archelaus
C) General Pompey
D) Herod Antipas
aa:Answer: A) Pontius Pilate \n\nExplanation: Pontius Pilate served as the non-Jewish governor of Judea from AD 26 to AD 36.


h1:Ch 3 - Worship - Old Testament
============================================
h2:Worship
Worship is due only to God

God is our creator, our protector, the one who sustains us - Isaiah 46:4 - “Even to old age I am he, and even to gray hairs I will carry you. I have made, and I will bear. Yes, I will carry, and will deliver”

- We express our faith and trust in God through worship
- When we are conscious of God’s presence or experience his presence, it’s our natural response to worship him
- Worship is man’s natural response to God that comes from the depth of his heart.

~m~A person’s mind, body & tongue are involved in true worship~m~

Our worship is a continuation & improvement on the Old Testament worship

Various forms of worship evolved without deviating from the fundamental faith.

h2:Jewish worship
Jews had compiled their scriptures in order to use it in their worship
- Song of songs used during the Festival of Passover
- Psalms are sung with the accompaniment of musical instruments during worship

Jews read scriptures in an atmosphere of prayer & worship at the Temple & renew their covenant with God

h2:Worship by Tribal Fathers
- No priests. The tribal fathers used to submit their offerings directly to Yahweh (Read Gen 12:6-8)
- In the story of creation, the 7th day was set apart for worship. However, no place was set apart
- During the time of Tribal fathers, when a person had a God-experience, that place became the place of worship
- The worship centred in God-experience and not on particular place, time or person
- The person himself became the priest & made offerings (Read Gen 26:23-25, Gen 33:18-20)

The details of offerings and worship during this period are not available. Places like Bethel, Gilgal and Peniel are mentioned as places of worship. All these are places where the fathers communicated with God

h2:Tabernacle
Exodus - On Mount Sinai, God gave Moses detailed instructions on how to build the Tabernacle - Length, breadth and height of the Tabernacle, its court, Ark of the covenant, the mercy seat, the altar of burnt offerings, the altar of incense etc.

Leviticus - Instructions about the sacrifices, rituals and offerings. Meat-offerings, sin-offerings, trespass-offerings and peace-offerings on prescribed days and times

Priests were from the house of Aaron (tribe of Levi). Levites were the assistants

When Israel moved from one camp to another, the Levites carried the ark on their shoulders. Levites carried the Tabernacle.

When they encamped at a place, the tabernacle was to be set in the middle of the camp

~m~The word Shekinah indicates God camping amidst the people - manifestation of the presence of God~m~

Israel camped / journeyed - as the cloud moved (Read Exo 40:36-38)

Tabernacle became a place of worship. It’s a portable arrangement set apart for offerings and prayers

The significance of places like Bethel, Gilgal and Peniel where Tribal Fathers could communicate with God slowly dissipated

~m~When Israel settled down at Canaan, the Ark was placed at Shiloh. So, Shiloh became a place of worship.~m~ The place Shiloh has no particular significance. It was the place where the Ark stood was the place of worship as it represented divine presence

This continued during the period of judges until King David

The concept of ‘priesthood only for the tribe of Levi’ changed. Samuel was not a Levite

h2:The Temple of Jerusalem
King David brought the Ark of the Lord from Shiloh to Jerusalem with great revelry

David could not build the Temple. King Solomon build the Temple of Jerusalem and placed the ark of the Lord permanently there

Thereafter the Temple of Jerusalem became the permanent location of divine presence

The worship of God and all offerings had to be made only in Jerusalem

The centralisation of worship caused a shift from sanctity of the hour of worship to the sanctity of the place of worship

The priests were appointed by the King. King David appoint priest Zadok

The kings would be anointed by either high-priest or the prophet (1 Samuel 16: 3, 1 Kings 1: 39). Prophets had God’s calling (Isaiah 6, Amos 7:14)

Jerusalem became the city of God and worship became centralised in the Temple of Jerusalem

h2:Synagogue
After Nebuchadnezzar destroyed Solomon’s Temple, the practice of making offerings to God came to an end. It was impossible to make offerings to God as they were taken away as captives

~m~During the period of captivity, a new form of worship developed - Worship at Synagogue~m~

There were no sacrifices at Synagogue

Instead they prayed to God, recited hymns (Psalms), read scriptures & learned the interpretation of the Scriptures

The role of the priest declined. The synagogue was under the charge of an elder or a precentor (cantor)

If the elder of the synagogue was convinced that someone could preach, he would be invited to preach

There would be a Chaburah meal or fellowship at the dining table

If the priest was present, there would also be a Final Benediction (Aaronic Benediction. Read Num 6:22-27)

These were the features of the new worship

h2:Second Temple Period
Following the proclamation of King Cyrus, Israelites returned from exile & rebuilt the second Temple

Worship at the Temple sacrifices were revived (Ezra and Nehemiah). However, worship at the Synagogue also continued

h2:Jesus
~m~Both Temple worship & Synagogue worship was present during Jesus’ time~m~

Mark 1:39 - “And he went into their synagogues throughout all Galilee, preaching and casting out demons”

Mat 21:12-23 - Jesus entered into the temple of God and drove out all of those who sold and bought in the temple, and overthrew the money changers’ tables and the seats of those who sold the doves. He said to them, “It is written, ’My house shall be called a house of prayer,’ but you have made it a den of robbers!“

h2:Ch 3 - Quiz

1. According to Christian teaching, to whom alone is true worship due?
A) The High Priest and the King
B) Only to God
C) The Temple and the Ark
D) The Patriarchs and Prophets
aa:Answer: B) Only to God \n\nExplanation: Worship is due only to God, who is our Creator, Protector, and Sustainer (Isaiah 46:4).

2. True or False: True worship involves a person's mind, body, and tongue.
A) True
B) False
aa:Answer: A) True \n\nExplanation: True worship is man\'s natural, heartfelt response to God, engaging the entire person—mind, body, and tongue.

3. How does Christian worship relate to Old Testament worship?
A) It completely rejects and abolishes it
B) It is a continuation and improvement upon it
C) It returns strictly to the rules of the Tabernacle
D) It replaces scripture reading with ritual sacrifice
aa:Answer: B) It is a continuation and improvement upon it \n\nExplanation: Christian worship evolved out of Old Testament foundations without deviating from the core faith, developing into a fuller and improved form of worship.

4. Which OT book was traditionally read and used by Jews during the Festival of Passover?
A) Genesis
B) Leviticus
C) Song of Songs
D) Ecclesiastes
aa:Answer: C) Song of Songs \n\nExplanation: Jewish worship featured scriptures set for specific occasions; Song of Songs was used during Passover, while Psalms were sung with musical instruments.

5. How was worship conducted during the era of the Tribal Fathers (Patriarchs)?
A) Levitical priests performed sacrifices at fixed altars
B) Worship was restricted exclusively to Jerusalem
C) There were no formal priests; individuals made offerings directly wherever they had a God-experience
D) Sacrifices were only conducted on the 7th day inside a synagogue
aa:Answer: C) There were no formal priests; individuals made offerings directly wherever they had a God-experience \n\nExplanation: Tribal fathers (like Abraham and Jacob) acted as their own priests, building altars at places like Bethel, Gilgal, and Peniel where they communicated directly with God.

6. When the Israelites settled down in the Promised Land (Canaan) prior to the construction of the Temple, where was the Ark of the Covenant placed?
A) Jerusalem
B) Shiloh
C) Bethel
D) Babylon
aa:Answer: B) Shiloh \n\nExplanation: Before Jerusalem became the center of worship, Shiloh was the primary sanctuary because the Ark stood there during the era of the Judges.

7. What Hebrew word signifies 'God camping amidst His people' or the manifestation of the divine presence?
A) Torah
B) Shekinah
C) Chaburah
D) TaNaKh
aa:Answer: B) Shekinah \n\nExplanation: \'Shekinah\' refers to the dwelling or divine manifestation of God living/camping among His people.

8. Under the Law given at Mount Sinai, priests were required to come from the house of Aaron, belonging to which tribe?
A) Judah
B) Benjamin
C) Levi
D) Ephraim
aa:Answer: C) Levi \n\nExplanation: Priestly duties were reserved for the house of Aaron within the tribe of Levi, while other Levites assisted in transporting and maintaining the Tabernacle.

9. Who brought the Ark of the Lord to Jerusalem, and who built the First Temple to house it permanently?
A) Moses brought it; Joshua built the Temple
B) King David brought it; King Solomon built the Temple
C) King Saul brought it; King David built the Temple
D) Samuel brought it; King Cyrus built the Temple
aa:Answer: B) King David brought it; King Solomon built the Temple \n\nExplanation: King David brought the Ark from Shiloh to Jerusalem, but it was his son, King Solomon, who constructed the First Temple.

10. What major shift occurred in Israelite worship as a result of centralizing worship at Solomon's Temple in Jerusalem?
A) Sacrifices were completely abolished
B) Focus shifted from the sanctity of the hour of worship to the sanctity of the place of worship
C) Synagogues replaced the need for priests
D) Anyone from any tribe could serve as High Priest
aa:Answer: B) Focus shifted from the sanctity of the hour of worship to the sanctity of the place of worship \n\nExplanation: Centralization made Jerusalem the mandatory single location for sacrifices, emphasizing the place itself.

11. During the Babylonian exile following Nebuchadnezzar's destruction of the Temple, what new form of worship developed among the Jews?
A) Tabernacle sacrifices
B) Synagogue worship
C) Monastic orders
D) Greek altar offerings
aa:Answer: B) Synagogue worship \n\nExplanation: Deprived of the Temple and unable to offer blood sacrifices, Jews in exile developed synagogue worship focused on prayer, scripture reading, and instruction.

12. Which of the following elements was absent from Synagogue worship?
A) Reading and interpreting Scriptures
B) Reciting and singing Psalms
C) Blood sacrifices and animal offerings
D) Fellowship meals (Chaburah)
aa:Answer: C) Blood sacrifices and animal offerings \n\nExplanation: Sacrifices were strictly reserved for the Jerusalem Temple; synagogue worship consisted of prayers, scripture readings, psalms, and preaching.

13. What two forms of worship existed side-by-side during the time of Jesus Christ?
A) Patriarchal altar worship and Tabernacle worship
B) Temple worship and Synagogue worship
C) Greek civic games and Parsi fire rituals
D) Levite processions and Monastic gatherings
aa:Answer: B) Temple worship and Synagogue worship \n\nExplanation: Both Temple worship (restored during the Second Temple period) and Synagogue worship (developed during the Exile) coexisted and were attended by Jesus.

14. When Jesus cleansed the Temple in Jerusalem (Matthew 21:12-13), what did He declare His house should be called?
A) A house of sacrifices
B) A house of prayer
C) A palace for kings
D) A synagogue for elders
aa:Answer: B) A house of prayer \n\nExplanation: Rebuking the money changers, Jesus quoted Scripture saying, \'My house shall be called a house of prayer, but you have made it a den of robbers!\'

15. According to Chapter 3, what is the primary reason human beings are compelled to worship God?
A) Because the Law of Moses strictly demands it on pain of death
B) As a natural response from the depth of the heart when conscious of God's presence
C) To earn salvation and forgiveness through sacrifices
D) To maintain national and political unity in Jerusalem
aa:Answer: B) As a natural response from the depth of the heart when conscious of God\'s presence \n\nExplanation: The text states that when we are conscious of or experience God\'s presence, worship is man\'s natural response coming from the depth of his heart.

16. In the Creation story, which day was set apart for worship?
A) The 1st day
B) The 3rd day
C) The 5th day
D) The 7th day
aa:Answer: D) The 7th day \n Explanation: In the story of creation, the 7th day was set apart for worship, though no specific physical place was set apart at that time.

17. When the Israelites moved camp in the wilderness, how was the Ark of the Covenant transported?
A) It was carried on a wooden cart pulled by oxen
B) It was carried on the shoulders of the Levites
C) It was carried exclusively by the High Priest alone
D) It remained permanently inside a central tent
aa:Answer: B) It was carried on the shoulders of the Levites \n\nExplanation: Whenever Israel moved from one camp to another, the Levites carried the Ark of the Covenant on their shoulders.

18. Who appointed Priest Zadok to serve at the Temple in Jerusalem?
A) Moses
B) Samuel
C) King David
D) King Cyrus
aa:Answer: C) King David \n\nExplanation: The text notes that priests were appointed by the King, specifically mentioning that King David appointed Priest Zadok.

19. Who was in charge of leading and administering a Synagogue during the Exile period?
A) The High Priest from Jerusalem
B) An Elder or a Precentor (Cantor)
C) A prophet appointed by God
D) An official appointed by the King of babylon
aa:Answer: B) An Elder or a Precentor (Cantor) \n\nExplanation: In synagogue worship, the role of the sacrificial priest declined, and the synagogue was placed under the charge of an elder or precentor (cantor).

20. What was the name of the fellowship meal held at the dining table as part of Synagogue worship, and what blessing was pronounced if a priest was present?
A) Passover meal; Mosaic Blessing
B) Chaburah meal; Aaronic Benediction (Numbers 6:22–27)
C) Agape meal; Davidic Blessing
D) Shekinah meal; Levitical Benediction
aa:Answer: B) Chaburah meal; Aaronic Benediction (Numbers 6:22–27) \n\nExplanation: Synagogue worship featured a Chaburah (fellowship) meal and, if a priest was present, concluded with the Aaronic Benediction.


h1:Ch 4 - Priesthood - Old Testament
============================================
h2:Priesthood
~m~Purohitan (sanskrit) = one who stands ahead of others / one who is vested with authority ~m~

Vaidikan (sanskrit) = one who knows scriptures / one who has learned the scriptures properly

In Hebrew, the word ‘Kohen’ is used in the sense of ‘priest’

Hebrew word ‘Kohen’ (used 740 times in the old testament) = bow before God / Worship or submit to God

Syriac work ‘Kahen’ (‘Kohne’ is derived from this root word) = one who brings prosperity / joy

LXX translates Kohen as ‘Hiyareh Yoos’ (Greek) = Pure / taintless

The church uses the word priest incorporating all these meanings

h2:Old Testament
Genesis 14: 18-20 - ~m~King Melchizedek - First mention of priesthood. There are no references to the origins or history of this priest~m~ (Ref: Heb 7:1-3, Psalms 110:1-4, Heb 7:4-10)

Tribal Fathers made offerings directly to Yahweh

Moses himself sprinkled the blood after the sacrifice. No priest referred here (Ref Exo 24:4-8)

Judges 17 talks about a man in Ephraim named Micah makes an idol and installs one of his sons as his Priest

h2:Levitical Priesthood
Exodus 29:10-25 & Leviticus 8:22-28 talks about consecration offering. Through these Aaron and his sons are set apart as priests unto God. Here Moses himself makes the offering

Consecration or sanctifying is the ritual of submitting the offerings to the Master first and after receiving them back, burning them on the altar

Aaronic Priesthood is inherited (Ref Lev 16:32)

The priest is separated from others and is as separated to the Lord as the holy altar and the clean and unblemished offering sacrificed upon it (Read Exo 28:36-38)

Henceforth the priest stands separated from all uncleanness

Lev 21:1-6 says that the priest should keep away from all that defiles him

He had to be extremely careful while entering the sanctuary of the Lord. He had to be adorned with special vestments (Ref. Ex 28:43), wash his clothes (Ref. Num 8:7), cleanse himself (Ref. Ex 30:17-20, 40:31-32, Lev 8:6-7), and had to keep away from intoxicating drinks (Lev 10:8-11)

All these provide dignity and respectability to the priest

Only men could become priests and they should not be physically deformed (Ref. Lev 21:16-21)

~m~The High Priest was to be adorned with special vestments on all occasions except on the Day of Atonement~m~ (Ref Lev 16, Exo 28:43)

Thus the responsibilities of Old Testament priesthood developed as a result of the changing social circumstances. The office of priesthood ensured salvation & blessing to all people. The priest was a mediator between God & man.
ip:- In seeking God’s answer & in teaching the people, the priest is the representative of God before his people.
ip:- In executing the cultic duties & in seeking refuge in God, the priest is the representative of the people before God.

h2:Priesthood at the time of Kings
At the time of Eli and Samuel, the office of Prophet, priest and judge were vested with a single person

Samuel was not a Levite (he was an Ephraimite). Ref 1 Samuel 1 (verses 1,2)

During the period of kingship, the practice of King appointing the priest came into existence

King David appointed Zadok and Ahimelech (Ref 2 Samuel 8:17) as Priests

King Solomon retained only Zadok as priest (Ref 1 Kings 2:27-35) (Ahimelech’s son Abiathar sided with Adonijah)

Priests anointed Kings. Also Read Num 27:18-21. Zadok the priest and Nathan the prophet anointed King Solomon.

When Israelites went into captivity, the priest was vested with political leadership as well (Ezra, Nehemiah)

The priest became the social leader as king, priest and prophet

Kingship ceased to exist and prophecy waned

The hierarchy of High Priest and other priests developed during the post-exilic period (Read Hag 1:1)

h2:Duties of Priests
Priesthood originated in connection with Mounts of offering. The priests originally were guards of these Mounts of offering. The first priests were ordinary people who took up the duty of protection.

People assembled at the Mounts of offering to see God’s commandments. The priest would inform God’s will to these people. It was Moses alone who had directly interacted with God. Others used media of divine consultation like Ephod (Hosea 3:4), Urim or Thummim to interact with the God (Read Deu 33:8-10)

Another important responsibility of the priests was to teach (Read Deu 33:10, Mal 2:7, Eze 44:23). Prophets have scolded priests for neglecting this duty. They criticised the priests who taught for hire (Ref Micah 3:11). The priests had to keep knowledge, seek the law from the Lord’s mouth and teach the people accordingly. The priest’s teaching should be centred on the scriptures, on wisdom and on law (Ref Haggai 2:11). The ministry of teaching was taken up by the Levites during the exilic period and the priests during the post-exilic period

When the temple was built and worship was centralized, cultic duties associated with sacrifices and offerings was the sole prerogative of the priests. Along with overseeing the sacrifice, the duties of the priests included setting the shewbread on the table, dressing the lamps, blowing the trumpet and blessing in the name of the Lord. These duties made the priest a mediator between God and man

Ref Deu 10:8, Deu 21:5, 1 Chr 23:13

h3:Conclusion
Thus the responsibilities of Old Testament priesthood developed as a result of the changing social circumstances. The office of priesthood ensured salvation and blessing to all people. The priest was a mediator between God and man. In seeking God’s answer and in teaching the people, the priest is the representative of God before his people. In executing the cultic duties and in seeking refuge in God, the priest is the representative of the people before God

h3:Urim and Thummim (Not in the textbook)
The Urim (Hebrew: “lights“) and the Thummim (Hebrew: “perfection“ or “truth“) are elements of the hoshen, the breastplate worn by the High Priest attached to the ephod, a type of apron or garment.

The pair are used frequently in the Old Testament, in Exodus 28:30 through God’s instruction to Aaron on how to adorn his breastplate worn in the holy place; in 1 Samuel 14:41 by King Saul to determine who was at fault for breaking the army’s fast.

Modern scholars have noted the meaning of Lights and Perfection as being epithets for Jesus Christ, both the Light and Truth (perfection).

There is no description of the form of the Urim and Thummim in the passage describing the high priest’s vestments

h1:Ch 5 - Jewish festivals
============================================
h2:Canonical Jewish Feasts
h4:Canonical Feasts~m~
Feasts prescribed in the scriptures (Pentateuch / Torah). All men were to come before God on these three feasts (Read Exo 23:14-17, Exo 34:23-24)
- Passover & Feast of Unleavened Bread
- Pentecost / Feast of Weeks / First Fruits / Shavout
- Feast of Tabernacles - Harvest Festival / Sukkot

h3:1. Passover & Feast of Unleavened Bread
First one in the calendar of feasts of the Jews

Unleavened bread for 7 days

Observed in commemoration of God liberating Israel from Egypt

Begins on 14th of Abib, the 1st month of the Jewish Calendar (Read Exodus 12:1-18)

On the evening of that day, Jews sacrifice the Passover Lamb and observe the Passover

From 15th day onwards, the feast of unleavened bread should be observed for 7 days

There should be a convocation on the 1st & 7th day (Lev 23:6-8)

The unleavened bread was a symbol of affliction & haste (Deu 16:2-3)

Originally the Passover was not a pilgrimage feast

Since King Josiah of Judah convened all his people at Jerusalem and observed the Passover, this became a feast to be observed at Jerusalem annually (Read 2 Kings 23:21-23)

Earlier it had been a feast observed in Jewish home. The animal killed was according to the size of the household and feast had been eaten in haste (Exo 12).

The blood was then put over the door posts and beams of the household. The description that this feast would redeem the first born from death and the Angel of Death would Passover the houses of those who observe it confirms that it had been a household feast (Exo 12:13)

h3:2. ~m~Pentecost ~m~/ Feast of Weeks / First Fruits / Shavout
This is the second festival according to the Jewish Calendar (Exo 23:14-17)

This feast was to be observed seven weeks after the observance of the feast of the Unleavened Bread (Deu 16:9-11)

The word Pentecost means 50. Shavout means ‘weeks’

Also known as the Feast of First Fruits and is observed on a single day

The scriptures command that no one should appear empty handed before the Lord on that day (Deu 16:16-17, Lev 23:17-20)

The Jews should make a special offering of atonement besides the meat-offering and drink-offerings on that day (Num 28:26-31)

Digression 1 (not in text book): The Holy Spirit's outpouring at Pentecost broke down barriers of language and culture, uniting people from different nations and backgrounds into one body in Christ. It's seen as a reconciliation of humanity, healing the divisions caused by the Tower of Babel. Read Lev 23:15-16. Read Acts 2:1-6

Digression 2 (not in text book): In the rabbinic period, and probably earlier, Pentecost came to be celebrated as more than an agricultural festival; it was the anniversary feast of the giving of the Law or the establishment of the covenant at Sinai. Birth of the church at Pentecost under the new covenant.

h3:3. Feast of Tabernacles - Harvest Festival / Sukkot
This is a great feast observed after the harvest is completed

Under the clear skies of spring, people build booths or tabernacles and leaving their homes would dwell in them for a week (Lev 23:33-34)

This feast was a memorial of Israelites living in booths or tabernacles in the desert (Lev 23:42-43)

Last Jewish festival according to their calendar (Ex 23:14-17, Lev 23, Deu 16)

This feast falls on the week after the 15th day of the 7th month

It was to be observed when all the grain and wine are collected (Deu 16:13)

In the post exilic period, people celebrated this feast as a pilgrim festival (Ezra 3:1-2,4 - gathered in Jerusalem)

Digression 1 (not in textbook): Sukkot means thicket, hut

Digression 2 (not in textbook): Tabernacles is unique, in that the nations also were invited in ancient times to come up to Jerusalem at this season to worship the Lord alongside the Jewish people. This tradition first arose from the command given to Moses that Israel should sacrifice seventy bulls at Sukkot (Numbers 29:12-35), which were offered for the seventy nations descended from Noah (Genesis 10:1-32). When Solomon later dedicated his Temple at Sukkot, he also called on the Lord to hear the prayers of all the foreigners that would come there to pray (Read 2 Chronicles 6:32-33). Thus, Jerusalem and the Temple itself were destined from the start to be a “house of prayer for all nations” (Read Isaiah 56:7).

Read (Zech 14:9, 16-19)

The prophet Zechariah foretells of a time when all nations will ascend to Jerusalem from year to year to “worship the King, the Lord of hosts, and to keep the Feast of Tabernacles” (Read Zechariah 14:1-3,9,16). Future prophetic purpose hidden in this unique festival which will soon be revealed – and it has to do with the second coming of the Lord.

h2:Other Jewish Feasts
Other Jewish feasts that can be included in the list of canonical feasts are
&emsp; Sabbath - 7th day
&emsp; Sabbatical Year - 7th year
&emsp; Yobel Year (Year of Jubilee) - Year after 7 Sabbatical Years (50th Year)

These are specially set apart for the Lord.

These are times of rest.

h3:Sabbath
~m~Originated from God’s act of creation and liberation of Israelites from Egypt~m~ (Read Exo 20:8-11, Deu 5:12-15)

The Jews were directed to present their offerings on that day (Read Num 28:9-10)

h3:Sabbatical Year
Read Exo 23:10-11. Lev 25:1-7. Lev 25:20-22
&emsp; The land was laid fallow during the 7th year
&emsp; The yield from the left-over crops in the 7th year shall be gleaned by orphans, the poor and the widows
&emsp; The slaves should be liberated during the Sabbatical Year (Exo 21:2)

h3:~m~Yobel Year - Year of Jubilee~m~
Read Lev 25:8-12
&emsp; The year after 7 Sabbatical Years
&emsp; The year of deliverance
&emsp; Sound the trumpets throughout the land and proclaim liberty to all its inhabitants
&emsp; Every man is allowed to return to his possession
&emsp; The Yobel year should be observed in the same way as the Sabbatical Year
Also Read Lev 25:20-23

h2:Day of Atonement - Yom Kippur
The Day of Atonement (Yom Kippur) also emerged as an important festival

Read Lev 23:27-29

ip: The 10th day of the 7th month
ip: It is a day of fasting
ip: This day is known as Yom Kippur
ip: A day of afflicting the souls (*humble themselves)
ip: Only day of the year in which the High Priest entered the inner sanctuary with incense and blood offering
ip: The High Priest was to be adorned with special vestments on all occasions except on the Day of Atonement (Read Lev 16, Exo 28:43)

Read Lev 16:2, 6-16, 20-22, 29-30

Three different cultic rituals offered observed on the day
ip: a. A bullock is offered for the sake of the priests
ip: b. A goat is offered for the sins of the people
ip: c. A scapegoat is chosen by casting lots is abandoned in the wilderness for the iniquities and transgressions of the Jews

Read Hebrews 9:1-8, 11-24, 27-28

h2:Non-canonical feasts
These are the feasts which developed during the later stages

h3:1. Purim - Festival of Lots
‘Purim’ means lot. Also called the ‘Day of Mordechai’

Observed on the 14th day of Adar (12th month of Jewish Calendar) - 2 Macc 15:36

Commemoration of the deliverance of Jews from their enemy Haman through Queen Esther (Est 9:24-28)

h3:2. Hanukkah - The feast of dedication
Commemoration of the defeat of Antiochus IV by Judas Maccabees

Judas and his troops reclaimed and purified the Temple of Jerusalem, which had been defiled by the sacrifice of profane animals and started the offerings to Jehovah once again

This day of restoration is observed as a Feast

This feast begins on the 25th day of Kislav, the 9th month. It was an 8 day long feast

Candles are lit for the 8-day Feast of dedication commemorating the miraculous defeat

~m~Hanukkah is also known as “Festival of Lights”~m~

Jesus Christ went to Jerusalem for the Feast of Dedication (John 10:22-23)

Read 1 Macc 4:52-56, 59

h2:Ch 5 - Quiz

1. On which date of the first month of the Jewish calendar (Abib) does the Passover begin?
A) 1st day
B) 10th day
C) 14th day

aa:Answer: C) 14th day \n\nExplanation: The text states that the Passover begins on the 14th day of Abib (the first month of the Jewish calendar), where the Passover lamb is sacrificed on the evening of that day.

aa:Answer: A) Pentecost means 50; Shavout means \'weeks\' \n\nExplanation: The text specifies that Pentecost translates to \'50\' (celebrated seven weeks after the Feast of Unleavened Bread) and Shavout means \'weeks.\'

5. On what occasion is the Feast of Tabernacles (Sukkot) observed according to the Jewish calendar?
A) On the 14th day of the 1st month
B) On the week after the 15th day of the 7th month

aa:Answer: C) The 50th year (the year after 7 Sabbatical Years) \n\nExplanation: The Yobel Year (Year of Jubilee) occurs after 7 Sabbatical Years (the 50th year). It is a year of deliverance where trumpets are sounded to proclaim liberty and permit men to return to their possessions.

7. On Yom Kippur (the Day of Atonement), who is allowed to enter the inner sanctuary, and what unique clothing rule applies?

aa:Answer: B) The High Priest enters; he wears special vestments on all occasions except on this day. \n\nExplanation: Yom Kippur (10th day of the 7th month) is the only day the High Priest enters the inner sanctuary with incense and blood offering. The text highlights that the High Priest is adorned with special vestments on all occasions except on the Day of Atonement.

8. During the Day of Atonement, what is done with the goat that is chosen by casting lots as the 'scapegoat'?
A) It is sacrificed for the priests.
B) It is burned on the altar outside the gate.
C) It is abandoned in the wilderness for the iniquities and transgressions of the Jews.
D) It is given to the orphans and widows.
aa:Answer: C) It is abandoned in the wilderness for the iniquities and transgressions of the Jews. \n\nExplanation: Three cultic rituals occur on Yom Kippur: a bullock for the priests, a goat sacrificed for the people\'s sins, and a scapegoat chosen by lots that is abandoned in the wilderness bearing the people\'s iniquities.

9. Which non-canonical feast is also known as the 'Day of Mordechai' and commemorates the deliverance of Jews from Haman through Queen Esther?
A) Hanukkah
B) Purim
C) Sukkot
D) Shavout
aa:Answer: B) Purim \n\nExplanation: Purim (meaning 'lot') is observed on the 14th day of Adar (12th month) to commemorate the deliverance of the Jewish people from Haman through Queen Esther. It is also called the \'Day of Mordechai.\'

10. Why is Hanukkah known as the 'Festival of Lights,' and how long does it last?
A) It lasts 7 days and celebrates the creation of light in Genesis.
B) It lasts 8 days and commemorates the cleansing of the Temple, with candles lit across the feast.
C) It lasts 1 day and commemorates the pillar of fire in the desert.
D) It lasts 50 days and celebrates the giving of the Law on Mount Sinai.
aa:Answer: B) It lasts 8 days and commemorates the cleansing of the Temple, with candles lit across the feast. \n\nExplanation: Hanukkah (Feast of Dedication) begins on the 25th day of Chislev (9th month) and lasts 8 days. It celebrates Judas Maccabeus defeating Antiochus IV, purifying the defiled Temple, and restoring sacrifices. Candles are lit for 8 days, earning it the name \'Festival of Lights.\'

11. Which festival marks the end of the Jewish calendar year of feasts as prescribed in the Torah/Pentateuch?
A) Passover
B) Pentecost
C) Feast of Tabernacles (Sukkot)
D) Purim
aa:Answer: C) Feast of Tabernacles (Sukkot) \n\nExplanation: The text notes that the Feast of Tabernacles is the last Jewish festival according to their calendar (Exodus 23:14–17, Leviticus 23, Deuteronomy 16).

12. What specific actions were commanded for the Sabbatical Year regarding the land and the poor?
A) The land was burned down, and all foreigners were expelled.
B) The land was laid fallow, left-over crops were gleaned by the poor/widows/orphans, and slaves were liberated.
C) The land was divided equally among priests, and all taxes were doubled.
D) The land was planted exclusively with wheat, and a tax was paid to the King.
aa:Answer: B) The land was laid fallow, left-over crops were gleaned by the poor/widows/orphans, and slaves were liberated. \n\nExplanation: According to Exodus 23:10–11 and Leviticus 25:1–7, the Sabbatical Year required the land to rest, the yield to be gleaned by orphans/poor/widows, and slaves to be set free in the 7th year.

13. Which historical figure and enemy were defeated, leading to the establishment of the Feast of Purim?
A) Antiochus IV defeated by Judas Maccabees
B) Haman defeated through Queen Esther
C) Pharaoh defeated through Moses
D) Goliath defeated through King David

14. True or False: The feast of Purim is also known as the Festival of Lights.
A) True
B) False
aa:Answer: B) False \n\nExplanation: Hanukkah is known as the \'Festival of Lights\' (commemorating the purification of the Temple and the lighting of candles for 8 days). Purim is known as the \'Festival of Lots\' or the \'Day of Mordechai.\'

15. Which of the following best provides a brief note on Canonical Jewish Festivals?
A) They are optional feasts created by local kings during the post-exilic period to honor foreign rulers.

aa:Answer: B) They are feasts prescribed in the scriptures (Pentateuch/Torah) where all men were required to come before God on three main festivals (Passover, Pentecost, and Tabernacles). \n\nExplanation: The text defines Canonical Feasts as those prescribed in the Pentateuch/Torah, noting that all men were commanded to appear before God on the three major feasts (Passover, Pentecost, and Tabernacles).

17. True or False: The Sabbath had its origin in God\’s act of creation and the liberation of Israelites from Egypt.
