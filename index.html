t5:&emsp; God the Father and the Holy Spirit                     || With the Father, and the Holy Ghost,
t5:&emsp; (Mat 28:19, 2 Cor 13:14)                               || Have Thou mercy on us all.

h2:About the Hymn

Ephesians 5:19-20 - Speaking to yourselves in psalms and hymns and spiritual songs, singing and making melody in your heart to the Lord. Giving thanks always for all things to God the Father in the name of our Lord Jesus Christ

~m~St. Paul talks about 3 types of songs in Worship.~m~ This is a hymn

This hymn is greater than just a song. It declares the creed of the church

Mar Severios sings about the mystery of Incarnation of Jesus Christ

Proclamation of the creed of the church along with being a hymn to God

h2:Mar Severios of Antioch (AD 465 - 538)
5th Diptych: “We remember also our Patriarch St. Severus, the crown of the Syrians, the eloquent mouth, the pillar and the doctor of the Holy Church of God as a whole; the meadow abounding in​ blossom, who preached all the time that Mary was undoubtedly the God - bearer”

Born into an affluent family in the city of Sozopolis of Pisidia  in AD 465

Trained in language and oratory in Alexandria

Later, he went to Beirut and became well versed in Roman Law

During his stay in Beirut, he came to know about the Cappadocian fathers and became a Christian

Mar Severios took vows of Monasticism

Even though he was an expert in law, he preferred to stay in Jerusalem and lead the life of an ascetic

He donated his family wealth to the poor

He not only sang about the Incarnated Christ but also testified Christ through his life

After the council of Chalcedon, there arose a dispute regarding the unity of Christ’s Nature

Mar Severios expounded and defended the belief in One Nature of Christ and staunchly opposed the Two Nature theorists

His treatises, epistles and debates on this enlighten us in Christology

In AD 512, he was consecrated the Patriarch of Antioch

In his first speech on assuming the throne, he extolled the creed of the Great Councils of Nicaea, Constantinople & Ephesus; & rejected the heresies of the council of Chalcedon

In those days, non-Chalcedonians were cruelly persecuted

Mar Severios also suffered. He fled to Egypt and passed away in AD 538

He authored several great writings including this hymn

h3:Notes
In this solemn hymn, we commemorate the Mother of God, Saints, Christ’s Birth, Passion and Crucifixion

We also rely upon the Holy Trinity through this hymn

~m~In the Maniso of Mar Severios, only the events from the Birth till the Resurrection of Jesus Christ are mentioned

~m~On the other hand, Nicene creed states about Christ’s Ascension, the state of Him being seated on the right-hand side of the Father and His second coming

St. Paul states that, at the name of Jesus who was crucified and resurrected, “every knee should bow, of those in heaven and of those on earth and of those under the earth” (Philippians 2:10-11). God the Father would be glorified through Jesus Christ

~m~The public celebration of our Holy Eucharist begins with the commemoration of the salvific work of the Incarnated Lord Jesus Christ.

~m~Like angels, shepherds and wise men who bowed to Jesus when He was born in Jerusalem, we too bow before the Lord at the beginning of the Holy Eucharist

~m~This is ritually indicated through the priest encircling the altar and censing the altar and the people

~m~The people who make the sign of cross and bow to the censing confess the Gospel and their faith in Jesus Christ

h2:Ch 18 - Quiz

1. What is the literal meaning of the Syriac liturgical term "Maniso"?
A) Prayer of repentance
B) Praise
C) Procession of the Cross
D) Preface of the Altar
aa:Answer: B) Praise \n\nManiso (Syriac) means \'praise,\' and these praises are composed from hymns in the Bible and the Liturgy of the Early Church.

2. What is the opening ekbo recited by the priest while censing the Altar when the chancel is unveiled for the Holy Eucharist?
A) Sleeba vennu...
B) Mariam Deelethok... (Mary who bore Thee; John who baptised Thee, May They be to Thee supplicants for us: Have mercy on us)
C) Nadha the sthuthiyum...
D) Vellum shathrukkale...
aa:Answer: B) Mariam Deelethok... (Mary who bore Thee; John who baptised Thee, May They be to Thee supplicants for us: Have mercy on us)

3. How is the prologue/ekbo prayer modified when it is sung later within the hymn "By thy Mother’s earnest prayers"?
A) It mentions St. Peter and St. Paul instead of St. Mary.
B) Instead of specifying the name of St. John along with St. Mary, all saints are commemorated.
C) It is sung exclusively in Greek without mentioning any saints.
D) It is omitted completely during the Holy Eucharist.
aa:Answer: B) Instead of specifying the name of St. John along with St. Mary, all saints are commemorated. \n\nThe hymn version uses By thy Mother\’s earnest prayers, By thy Saints\’ entreaties, commemorating all saints rather than naming St. John individually alongside St. Mary.

4. Which Pauline passage is cited as the scriptural foundation for the Christological teaching in the first part of the hymn regarding Christ's condescension?
A) Romans 6:4–6
B) Philippians 2:6–7
C) Ephesians 5:19–20
D) Colossians 4:16
Answer: B) Philippians 2:6–7 \n\nThe text cites Philippians 2:6–7 (\'Who being in the form of God did not consider equality with God a thing to be grasped. But made himself of no reputation...\') to explain Christ's self-emptying and incarnation.

5. Which ideas regarding Jesus Christ are expounded in the first part of the hymn?
A) That Jesus was a prophet.
B) That Jesus is Lord, King, Word, and Father’s Sole-begotten Son; though immortal, He incarnated out of tender mercy for our salvation from the pure Virgin Mary while His true divine nature remained unaltered, and He was crucified for all believers.
C) That Jesus never took a real human body but only appeared so.
D) That Jesus shared His rule above the Roman emperors.
aa:Answer: B) That Jesus is Lord, King, Word, and Father’s Sole-begotten Son; though immortal, He incarnated out of tender mercy for our salvation from the pure Virgin Mary while His true divine nature remained unaltered, and He was crucified for all believers.

6. What ideas regarding Jesus Christ are expounded in the second part of the hymn?
A) His baptism in the Jordan and his journey into the wilderness.
B) That by virtue of His death He trampled upon death, and that He is One of three Persons of the Holy Trinity, worshipped and praised equally with the Father and the Holy Ghost.
C) His ascension to heaven and his hidden second coming.
D) His selection of the twelve disciples in Galilee.
aa:Answer: B) That by virtue of His death He trampled upon death, and that He is One of three Persons of the Holy Trinity, worshipped and praised equally with the Father and the Holy Ghost. \n\nExplanation: The second part expounds Christ's victory over death and His equality within the Holy Trinity (citing Matthew 28:19 and 2 Corinthians 13:14).

7. According to St. Paul in Ephesians 5:19–20, what three types of songs/expressions are used in Christian worship?
A) Psalms, hymns, and spiritual songs
B) Prophecies, laments, and doxologies
C) Parables, creeds, and blessings
D) Processionals, recessionals, and litanies
aa:Answer: A) Psalms, hymns, and spiritual songs \n\nExplanation: Citing Ephesians 5:19–20, the text notes that St. Paul talks about three types of songs in worship: psalms, hymns, and spiritual songs (identifying the Maniso as a hymn).

8. Why is the Maniso considered "greater than just a song"?
A) Because it must be sung only by ordained bishops.
B) Because it declares the creed of the church and sings about the mystery of the Incarnation.
C) Because it replaces the reading of the Gospel during Lent.
D) Because it was written in ancient Latin.

9. Who authored the Maniso (Anthem) "By thy mother's earnest prayers"?
A) Mar Yuhanon I
B) Mar Severios of Antioch (AD 465–538)

10. How is Mar Severios commemorated in the 5th Diptych of the Orthodox Church?
A) As the builder of the Church of the Holy Sepulchre

C) As the first king of Jerusalem
D) As the translator of the Bible into Greek
aa:Answer: B) As the crown of the Syrians, eloquent mouth, pillar and doctor of the Holy Church, and meadow abounding in blossom who preached that Mary was undoubtedly the God-bearer 

11. In which city was Mar Severios born in AD 465 into an affluent family?

12. Where did Mar Severios study language, oratory, and Roman Law before becoming a Christian and monk?

aa:Answer: A) Studied oratory in Alexandria and Roman Law in Beirut \n\nHe was trained in language and oratory in Alexandria, and later went to Beirut where he studied Roman Law and came to know the Cappadocian fathers.

13. Which theological controversy did Mar Severios staunchly defend following the Council of Chalcedon?

aa:Answer: B) He expounded and defended the belief in One Nature of Christ (Miaphysitism) and opposed the Two Nature theorists. \n\n After Chalcedon, Severios defended the One Nature of Christ against the Two-Nature (Chalcedonian) position through his treatises, epistles, and debates.

14. In what year was Mar Severios consecrated as the Patriarch of Antioch?

B) AD 465
C) AD 512
D) AD 538

15. What did Mar Severios do during his first speech upon assuming the Patriarchal throne?

aa:Answer: B) He extolled the creed of the Great Councils of Nicaea, Constantinople, and Ephesus, and rejected the heresies of the Council of Chalcedon.

16. Where did Mar Severios flee when non-Chalcedonians were cruelly persecuted, and in what year did he pass away?

B) Fled to Egypt; passed away in AD 538

D) Fled to Constantinople; passed away in AD 465
aa:Answer: B) Fled to Egypt; passed away in AD 538 \n\nFacing severe persecution of non-Chalcedonians, Mar Severios fled to Egypt, where he passed away in AD 538.

17. True or False: Events from the birth all the way through the ascension of Jesus Christ are mentioned in the Maniso of Mar Severios.
A) True

aa:Answer: B) False \n\nExplanation: The text explicitly clarifies under the Notes section that in the Maniso of Mar Severios, only the events from the Birth till the Resurrection of Jesus Christ are mentioned (not His ascension, session at the right hand of the Father, or second coming, which belong to the Nicene Creed).

18. How does the scope of the Maniso of Mar Severios compare to that of the Nicene Creed regarding Christ's timeline?

19. What ritual action performed by the priest at the beginning of the public celebration of the Holy Eucharist mirrors the angels, shepherds, and wise men bowing to Jesus?

aa:Answer: B) Encircling the altar and censing the altar and the people \n\nExplanation: The text explains that just as angels, shepherds, and wise men bowed to newborn Jesus, the priest censes and encircles the altar, and believers make the sign of the cross and bow in confession of their faith.

B) Their confession of the Gospel and their faith in Jesus Christ

Answer: B) Their confession of the Gospel and their faith in Jesus Christ \n\n People who make the sign of the cross and bow to the censing confess the Gospel and their faith in Jesus Christ.



h1:Ch 19 - The Ministration of Fraction, Consignation and Commixtion
==============================================================================

h2:Introduction

John 6:55,56 - For my flesh is true food and my blood is true drink. Those who eat my flesh and drink my blood abide in me, and I in them

The secret ministration performed in the veiled Holy of Holies during the Catholic Hymn “Hearken, gracious Lord we pray…” is known as the Ministration of Fraction, Consignation and Commixtion

~m~Jesus Christ who founded the Holy Eucharist took bread, blessed, broke and gave it to His disciples

~m~Our Holy Eucharist is divided into 4 parts based on these 4 acts of Jesus Christ

~b~Taking~b~: The act of taking indicates the preparatory ministrations and the lessons from the Holy Bible

~b~Blessing~b~: Blessing indicates the ministrations performed by the priest standing upon the altar step. This ministration ends with the ~m~Diptychs, which are a solemn part of our Eucharist ~m~

~b~Breaking~b~: What follows is the ministration of fraction, consignation and commixtion which is the act of breaking

~b~Giving~b~: The part of the Holy Eucharist from Lord’s prayer till the Holy Communion is the giving part

h2:The Second Benediction
~m~There are three Benedictions given during our Holy Eucharist

~m~After the second Benediction, the chancel is veiled and Catholic Hymn of ‘Hearken, gracious Lord, we pray…’ is sung

~m~While the 1st & 3rd benedictions are given in the name of the Holy Trinity, the 2nd benediction is given in the name of the Lord Jesus Christ

Benediction: “May the grace of Jesus Christ, the exalted God and our savior be upon you, my brethren, forever”

This is similar to the benedictions given by St. Paul in 1 Corinthians 16:23 and Galatians 6:18

h2:~m~Catholic Hymn~m~
The hymn recited after the veiling of the chancel is known as the catholic Hymn. This term means a general prayer

Certain special hymns are recited on this occasion on special days and feasts

However, we generally recite 2 hymns

h4:Hymn 1
Hearken, gracious Lord: This is a hymn to be recited meditatively.

It begs mercy from our Lord when the Holy Eucharist, which indicates the flesh of Jesus Christ is fractioned

It is the moment when we beg mercy from our Lord Jesus Christ who was crucified for our sake

h4:Hymn 2
Seraphim of fiery line: Composed in the background of the heavenly vision of prophet Isaiah (Read Isaiah 6:1-7).

It is a heavenly moment in which we realise that the chorus of angels are worshipping our Savior, Lord Jesus Christ

No one should go out of the church or engage in other activities on this occasion

~b~Isaiah 6:9-10:~b~- 9 He said, “Go, and tell this people, ’You hear indeed, but don’t understand. You see indeed, but don’t perceive.’ 10 Make the heart of this people fat. Make their ears heavy, and shut their eyes; lest they see with their eyes, hear with their ears, understand with their heart, and turn again, and be healed.“

~b~John 12:39-41:~b~- 39 For this cause they couldn’t believe, for Isaiah said again: 40 “He has blinded their eyes and he hardened their heart, lest they should see with their eyes, and perceive with their heart, and would turn, and I would heal them.“ 41 Isaiah said these things when he saw his glory, and spoke of him.

The vision in Isaiah 6 is a vision of the divine glory of God. By stating that Isaiah saw Jesus’ glory, John is testifying to the Deity of Jesus Christ, meaning Jesus shares the very same divine glory as the one Isaiah saw on the throne. Since “no one has ever seen God [the Father]“ (John 1:18), this vision of the visible manifestation of God’s glory is understood to be a manifestation of the pre-incarnate Son of God

h2:~m~The Ministration of Fraction ~m~
This ministration is called the ‘ministration of fraction’ because the priest breaks the Holy Bread kept in the Paten

Three events happen during this ministration
ip:  Fraction of the bread (The breaking of the Eucharistic bread)
ip:  Consignation of the Holy bread with the blood of Christ in the Chalice (sign of cross)
ip:  Commixtion (the act of mixing together) of the body and blood of Christ

The ministration of fraction is done secretly

The priest recites a prayer written by the Church father Dionysius Bar Salibi in the 12th century on this occasion

It is not just a prayer, but another declaration of the creed of the Church

The priest confesses the following through the recital of this prayer:
 1. Through the crucifixion of Jesus Christ, God the Word was broken and sacrificed for the sake of man’s salvation
 2. Jesus Christ did not lose God’s Essence from His body and soul due to death on the cross
 3. Jesus Christ died on the cross for the remission of sins of the entire creation.
 &emsp; Through crucifixion, we sinners (people inclined to the left) are transformed into a clean lot
 &emsp; (people inclined to the Right)

Through crucifixion, Jesus Christ reconciled Heaven and earth. Thereafter He resurrected on the third day. The offering of Christ on the Cross was a divine ministration for reconciliation between God and mankind, Jews and gentiles. This prayer secretly recited by the priest ends with the statement. ‘We believe in and confess what we have said. We affirm what we have said.’

h2:Litanies
Litanies are supplications recited by the deacon following the Catholic hymn

These prayers are composed in such a manner that we beseech for kindness from Lord Jesus Christ who became an offering on the cross for the entire the world

The crucifixion and resurrection of Jesus Christ has enabled our re-entry into paradise, which had been lost because of our sin

After commemorating these salvific events the chancel is unveiled and we prepare to recite the Lord’s prayer

As we read in Hebrews 10:19-22, we come to God the Father ‘by the blood of Jesus, By a new and living way which He consecrated for us, through the veil, that is, His flesh.’ With the freedom to cry out ‘Abba, father’ (Galatians 4:6-7)

Then we recite the prayer ‘Our Father in heaven…’ (Mat 6:9-13)

h2:Ch 19 - Quiz

B) Taking: Preparatory ministrations & Bible readings; Blessing: Ministrations at the altar step ending with Diptychs; Breaking: Ministration of fraction, consignation & commixtion; Giving: Lord’s prayer till Holy Communion
C) Taking: Procession of the Cross; Blessing: Catholic Hymn; Breaking: Sermon; Giving: Cemetery censing

h1:Ch 20 - Priesthood in Christianity
==============================================================================
h2:Introduction
The ecclesiastical positions in our church: Deacon, Priest, Bishop, Catholicos / Patriarch
~m~The three major orders of priesthood~m~
&emsp;1. The Bishop (Metropolitans) ⇒ Bishop = Overseer
&emsp;2. The Priest (Kashisha) ⇒ Priest = Elder
&emsp;3. The Deacon ⇒ Deacon = Servant
The above 3 are positions in the hierarchy of Priesthood

The below 2 are specially designated administrative posts of ecclesiastical authority
&emsp; Catholicos / Patriarch

Two kinds of priesthood
ip:  General Priesthood
ip:  Special Priesthood

h2:Special Priesthood
To act as the representative of Jesus Christ, special commission from the Lord is necessary

The authority to celebrate the Holy Eucharist was given only to selected 12, who by Apostolic succession passed it onto the High Priests and Priests

In the early days of Christianity, the apostles went to preach the Gospel to all nations as instructed by our Lord during His ministry

In every town, they appointed men of faith as bishops and gave them these instructions
ip:Paul Speaks to the elders of the Church: Acts 20:28 Take heed to yourselves and to all the flock, in which the Holy Spirit made you overseers, to care for the Church of God which He obtained with the blood of His own Son

1 Peter 5:2 Tend the flock of God that is in your charge, not by constraint but willingly, not for shameful gain but eagerly, 3 not as domineering over those in your charge but being examples to the flock
The bishops ordained priests and deacons to serve and teach

This was done by laying hands upon them and praying to the Lord to grant them the authority and the gift of priesthood through the Holy Spirit

This Holy Order of men serve the Lord by their special vocation as the priest and shepherd

Priesthood is one of the seven Holy Sacraments of our church

h2:The Bishop
~m~‘Bishop’ comes from the Greek word ‘episcopos’ meaning overseer~m~

The bishop is the head of our church

He is our representative to God and is also the representative of Christ to us

As St. Ignatius said, “Where the bishop is present, there let the congregation gather just as where Jesus is, there is the Universal Church”

The bishop is chosen by the congregation and then presented to the other bishops who lay their hands on him and pray to God to grant him the gifts and authority of the Holy Spirit, saying
ip:“Grant him, O Lord, the spirit of wisdom and understanding, the spirit of power and consolation, the spirit of knowledge and piety. That in pure prayer, and illuminated heart in love, he may raise the offering for the ignorance and sins of the people, and bring them back to Thy Holy fold, that they may be one flock belonging to one shepherd”
The bishop is a shepherd of his diocese

He preaches, teaches, and administers all the sacraments

He cares for his people in every way and guards them against wrong ideas or doctrines.

This is mentioned during the prayer of ordination
ip:“Be an imitator of Christ, the true shepherd, who did lay down His life for His sheep. Be a leader of the blind, a light to those who are in darkness, a teacher of the young, a lamp to the world”
===
h2:The Priest
The word priest comes from the Greek word “presbyteros” meaning elder

The priest is ordained by the bishop to watch over his parish, as an honest steward watching over the mysteries of God (Read Titus 1:5)

He is a pastor & shepherd who loves & cares for his people

~m~He can administer all the sacraments of the church except the Sacrament of Holy Orders ~m~

St. Ignatius describes the priests as the council of the apostles. As the apostles were gathered around Jesus Christ and carried out His work, the priests are gathered around the bishop and help carry out his work

The duties of a priest are contained in the prayer for ordination, as follows:
===
ip:“Our Lord Jesus Christ has entrusted you with His life-giving sacraments. Know that you carry upon your hand, Emmanuel who was carried by Simon, the priest. Guard these sacraments as the Cherubim guard the Tree of Life”
ip:“O Lord, fill him with Thy Holy Spirit, that he may be worthy to stand before Thine Altar; to proclaim the Gospel of Thy Kingdom: to minister to the word of truth; to offer unto Thee spiritual gifts and sacrifices”
The priest should be called and chosen by God, just as Aaron was

The priest should follow the example of Christ
ip:John 10:11 “I am the good shepherd. The good shepherd lays down his life for the sheep”
He is ready to sacrifice his life unto death, to search for the lost sheep, to mend the broken homes, to strengthen the weak

In his struggle during his ministry, the priest offers himself as a sacrifice on the altar of witness (witness Christ)

h2:The Deacon
Deacon is the name used for all those who are ordained before the ordination of priesthood

The term deacon however usually refers to a full deacon

The other orders typically seen are reader and sub-deacon

Deacon comes from the Greek word “diakonos” meaning servant

The deacon should be a good servant of the church

He bears the task of social service for widows, orphans, and poor people, and for different activities of the church

St. Ignasius says that the deacons have the ministry of Jesus Christ who was the greatest servantHe gives himself completely to God and to his fellow beings

He gives himself completely to God and to his fellow beings

Not in the textbook: Deu 10:8 At that time the Lord set apart the tribe of Levi to carry the ark of the covenant of the Lord, to stand before the Lord to minister to him and to bless in his name, to this day.

Numbers 8:5-25 talks about separating Levites for service to the Lord

Serving at the Altar is not something to be done lightly (Read Lev 10:1-3)

===========
h2:General Priesthood
Through baptism we become “a chosen race, a royal priesthood, a holy nation, a people for his own possession that we may proclaim the excellencies of Him who called you out of darkness into His marvelous light” (1 Peter 2:9)

We are called to be God’s people and we do not have to become priests and nuns to serve him; for all are called to serve

We have seen that God has given different kinds of gifts and talents to the members of His Church

He has given these gifts to build up His Church and bring everyone to full life in Jesus Christ

Each one of us is given special gifts & talents to use in our daily life
ip:We have to perform our duties as a teacher, a bishop, a priest, a nun, or as a good Christian father or mother, brother or sister, or child of God
If we put our trust in God and pray, “Thy will be done”, we may discover our special gifts, and how God wants us to use our gifts
ip:God called Mordecai to work as a guard in the King’s palace. He was able by his faith and courage to serve God and overcome the evil acts that were planned against the King and against God’s people
ip:Esther, the orphan girl, became queen and was able to perform a great role in saving the people. She was ready to sacrifice herself and her throne for serving God
===
We can use our gifts as special services in the world. If we have talents as artists, musicians, doctors, teachers, merchants, or nurses we must try to develop and use them as best as we can to the glory of God
Others may be called by God for special services in the Church, to serve His church as bishops, priests or deacons, but God has given the duty of service to all members of the church

He has made us all members of His church and members of His royal priesthood

He has made us people of God, His laity. Everyone is first ordained through Chrismation to be a layman of God, one of God’s own people

As layman, we are called to offer our services of praise and glory to God forever

We are called to live in communion with God as brothers and sisters in Jesus Christ

We are called to use God’s gift of the Holy Spirit all through our lives

In his models and images, St. Paul mentioned in his letters to his disciple Timothy the ways of serving God through one’s vocation in life
ip:The father who cares for his family: “If any one does not provide for his relatives, and especially for his own family, he has disowned the faith and is worse than an unbeliever” (1 Tim 5:8)
===
The rich man who uses his wealth in good works: “As for those who in the present age are rich, command them not to be haughty, or to set their hopes on the uncertainty of riches, but rather on God who richly provides us with everything for our enjoyment. They are to do good, to be rich in good deeds, generous and ready to share, thus storing up for themselves the treasure of a good foundation for the future, so that they may take hold of life that really is life.” (1 Tim 6:17-19)
The young men & women who preserve themselves pure: “If any one purifies himself from what is dishonorable, then he will be a vessel for noble use, consecrated and useful to the master of the house, ready for any good work” (2 Tim 2:21)

“Now a bishop must be above reproach, temperate, sensible, dignified, hospitable, an apt teacher… no drunkard, not violent but gentle, not quarrelsome, and no lover of money” (1 Tim 3:2,3)

The person who seeks the righteous life: “But as for you, man of God, shun all this; aim at righteousness, godliness, faith, love, steadfastness, gentleness” (1 Tim 6:11)

h2:Ch 20. Quiz

1. Which of the following is not included in the three major hierarchical orders of priesthood in our church?
A) Bishop
B) Priest
C) Ramban
D) Deacon
aa:Answer: C) Ramban \n\nThe three major positions in the hierarchy of Priesthood are Bishop (Episcopa), Priest (Kashisha), and Deacon (Diakonos). Positions like Patriarch or Catholicos are specially designated administrative posts, while Ramban refers to a monastic status, not a distinct order of the three major priesthood ranks.

2. The word "Bishop" comes from which Greek word, and what is its literal translation?
A) Presbyteros, meaning Elder
B) Episcopos, meaning Overseer
C) Diakonos, meaning Servant
D) Apostolos, meaning Sent One
aa:Answer: B) Episcopos, meaning Overseer

3. The word "Priest" comes from which Greek word, and what does it mean?
A) Diakonos, meaning Servant
B) Presbyteros, meaning Elder
C) Episcopos, meaning Overseer
D) Hieros, meaning Sacred
aa:Answer: B) Presbyteros, meaning Elder

4. The word "Deacon" comes from which Greek word, and what does it mean?
A) Presbyteros, meaning Elder
B) Episcopos, meaning Overseer
C) Diakonos, meaning Servant
D) Kashisha, meaning Holy One
aa:Answer: C) Diakonos, meaning Servant

5. True or False: A priest can administer all the sacraments of the church.
A) True
B) False
aa:Answer: B) False \n\nThe Priest can administer all the sacraments of the church except the Sacrament of Holy Orders. Only a Bishop can administer Holy Orders (Ordination).

6. How did Apostles pass on the authority of special priesthood to high priests, priests, and deacons?
A) By giving them written certificates of law
B) By laying hands upon them and praying for the gifts of the Holy Spirit
C) By bestowing earthly titles of nobility
D) By appointing them as governors in Rome
aa:Answer: B) By laying hands upon them and praying for the gifts of the Holy Spirit \n\nOrdination was done by laying hands upon chosen men and praying to the Lord to grant them authority and the gift of priesthood through the Holy Spirit.

7. Which quotation by St. Ignatius emphasizes the centrality of the Bishop in the church community?
A) "The deacon is the highest authority over scripture interpretation."
B) "Where the bishop is present, there let the congregation gather just as where Jesus is, there is the Universal Church."
C) "A priest operates independently of all council meetings."
D) "Every believer must become a monk to enter Paradise."
aa:Answer: B) Where the bishop is present, there let the congregation gather just as where Jesus is, there is the Universal Church.

8. How does St. Ignatius describe the relationship of priests to the bishop?
A) As rulers over the bishop
B) As the council of the apostles, gathered around the bishop to help carry out his work just as the apostles were gathered around Jesus
C) As officers managing collections
D) As temporary caretakers who change every year
aa:Answer: B) As the council of the apostles, gathered around the bishop to help carry out his work just as the apostles were gathered around Jesus

9. What solemn warning is given to the priest during his ordination prayer regarding the Holy Eucharist?
A) "Keep the Holy Eucharist hidden in a chest forever."
B) "Know that you carry upon your hand, Emmanuel who was carried by Simon, the priest. Guard these sacraments as the Cherubim guard the Tree of Life."
C) "Only distribute the sacraments to noblemen."
D) "Offer spiritual sacrifices only on full moon days."
aa:Answer: B) Know that you carry upon your hand, Emmanuel who was carried by Simon, the priest. Guard these sacraments as the Cherubim guard the Tree of Life. \n\n This excerpt from the ordination prayer stress the sanctity of handling the Body of Christ.

10. What primary ministry does a full Deacon bear within the church community according to St. Ignatius?
A) Ruling over diocesan finances
B) Social service for widows, orphans, and poor people, embodying the ministry of Jesus Christ as the greatest servant
C) Ordaining other priests and bishops
D) Presiding over ecumenical councils
aa:Answer: B) Social service for widows, orphans, and poor people, embodying the ministry of Jesus Christ as the greatest servant

11. What Old Testament tribe was set apart by the Lord to carry the ark of the covenant, stand before Him, and minister in His name?
A) Tribe of Judah
B) Tribe of Levi
C) Tribe of Benjamin
D) Tribe of Ephraim
aa:Answer: B) Tribe of Levi

12. Scripturally, based on 1 Peter 2:9, how is the "General Priesthood" of all baptized believers described?
A) "A silent assembly without any active role"
B) "A chosen race, a royal priesthood, a holy nation, a people for his own possession"
C) "An earthly army bound by civil laws"
D) "A council of elite scholars"
aa:Answer: B) A chosen race, a royal priesthood, a holy nation, a people for his own possession

13. Through which Sacrament does every Christian first become ordained as a layman of God and a member of the royal priesthood?
A) Holy Matrimony
B) Chrismation (along with Baptism)
C) Holy Orders
D) Anointing of the Sick
aa:Answer: B) Chrismation (along with Baptism) \n\nEveryone is first ordained through Chrismation to be a layman of God, one of God’s own people.

14. What warning does St. Paul give in 1 Timothy 5:8 regarding a father's duty to his family?
A) "A father must only focus on church affairs and neglect his home."
B) "If any one does not provide for his relatives, and especially for his own family, he has disowned the faith and is worse than an unbeliever."
C) "A father should hoard all wealth for himself."
D) "Family duties are secondary to secular honors."
aa:Answer: B) If any one does not provide for his relatives, and especially for his own family, he has disowned the faith and is worse than an unbeliever. \n\nThis exact verse (1 Timothy 5:8) is cited by St. Paul as a model of serving God through one\'s family vocation.

15. What advice does St. Paul give to rich people in 1 Timothy 6:17–19?
A) To set their hopes on uncertain riches and build larger barns
B) Not to be haughty, but to do good, be rich in good deeds, generous, and ready to share
C) To give up all wealth to the Roman Emperor
D) To stop working and live in complete leisure
aa:Answer: B) Not to be haughty, but to do good, be rich in good deeds, generous, and ready to share \n\n St. Paul instructs the rich to trust in God rather than uncertain riches, using their wealth generously for good works to store up a good foundation for the future.

16. According to 2 Timothy 2:21, how does a young man or woman become a "vessel for noble use, consecrated and useful to the master"?
A) By accumulating academic degrees
B) By purifying oneself from what is dishonorable
C) By isolating oneself permanently in a cave
D) By winning earthly political campaigns
aa:Answer: B) By purifying oneself from what is dishonorable \n\nCiting 2 Timothy 2:21, the text states that purifying oneself from dishonorable things makes one a vessel consecrated and ready for any good work.

17. Which qualifications for a Bishop are explicitly listed by St. Paul in 1 Timothy 3:2–3?
A) Wealthy, aggressive, quick-tempered, and politically connected
B) Above reproach, temperate, sensible, dignified, hospitable, an apt teacher, no drunkard, not violent but gentle, not quarrelsome, and no lover of money
C) Young, inexperienced, eager for fast money, and loud
D) Strictly trained in Roman law and philosophy only
aa:Answer: B) Above reproach, temperate, sensible, dignified, hospitable, an apt teacher, no drunkard, not violent but gentle, not quarrelsome, and no lover of money

18. What is the fundamental difference between Special Priesthood and General Priesthood?
A) Special Priesthood is for everyone; General Priesthood is only for bishops.
B) Special Priesthood is a specific sacramental vocation received through Holy Orders to shepherd, administer sacraments, and serve the altar; General Priesthood belongs to all baptized believers called to serve God using their daily talents and life vocations.
C) Special Priesthood requires no ordination, whereas General Priesthood requires laying on of hands by three bishops.
D) There is no difference; both terms mean the exact same thing in Orthodox theology.
aa:Answer: B) Special Priesthood is a specific sacramental vocation received through Holy Orders to shepherd, administer sacraments, and serve the altar; General Priesthood belongs to all baptized believers called to serve God using their daily talents and life vocations.


h1:Ch 21 - Holy Trinity
==============================================================================
h2:Introduction
~m~We believe in a Triune God - Three persons - Father, Son and the Holy Spirit. All these persons are completely God

~m~Triune God - One God and three persons at the same time

God is immeasurable and indefinable.

Man’s intellect is only a creation of God. A creation cannot fully comprehend the Creator

We cannot delimit God in numerals like one, three etc.

h2:Prayers and Sacraments
We confess our belief in the Holy Trinity in all our prayers and sacraments.

We begin with - “In the name of the Father, and of the Son and of the Holy Spirit, one true God.”

Shubaho… meaning “Glory be to the Father, Son and Holy Ghost” - This is also a praise to the Trinity

The prayers also end with a benediction in the name of the Holy Trinity

After the celebration of the Sosaffa during the Holy Eucharist, the priest gives the first benediction to the people in the name of the Holy Trinity: “May the love of God the Father, the grace of the Only Begotten Son and the communion of the Holy Spirit be with you all” - St. Paul also concludes 2nd Corinthians with this benediction

In the Holy Eucharist, the Holy Mysteries are elevated and celebrated with the pronouncement: “Holy mysteries, for the Holy and the undefiled.”. Following this, the declaration that “One Holy Father, One Holy Son and One living Holy Spirit” are ‘with us’ is made

This indicate - we are assembled in the presence of the Holy Trinity and we submit our prayers to the Holy Trinity

h2:Holy Trinity in the Old Testament
The Jews believed in one God. “O Israel, listen: Yahweh is our God, Yahweh is one” (Deu 6:4)

This verse was the creed of the Jews. However, we can find indications of the Holy Trinity throughout the Old Testament

1. Before the creation of Adam, the three persons of the Holy Trinity spoke among themselves
ip:Genesis 1:26 - And God said, Let us make man in our image, after our likeness
ip:Genesis 1:27 - So God created man in his own image, in the image of God created he him
In the first verse, plural form (us, our) and in the second verse singular form (his) is used to designate God. These verses indicate that God is three in form and One God simultaneously

2. In the Old Testament we find indications of the Word of God and the Holy Spirit
ip:Psalms 33:6 - By the word of the LORD (the Son) were the heavens made; and all the host of them by the breath of His mouth (the Holy Spirit)
The word used for breath in both Hebrew and Syriac is rooho (Spirit). Here the reference is to the Son and the Holy Spirit who partook with the Father in the act of creation
ip:Psalms 147:18 - He sends out his word (the Son), and melts them: he causes his wind (Spirit) to blow, and the waters flow.
====
3. Psalms 51:11 - Do not cast me away from your presence; and do not take your holy spirit from me

4. Isaiah 61:1 - The Spirit of the Lord GOD is upon me; because the LORD has anointed me to preach good tidings to the meek;
====
h2:Holy Trinity in the New Testament
====
The manifestations of the Holy Trinity in the Old Testaments were partial

But a complete revelation of the Holy trinity is manifested in the New Testament

Jesus Christ made revelations regarding the two persons of Father and the Holy Spirit

~m~The first manifestation of the Holy Trinity is at the baptism of Jesus Christ. When Christ was baptized in River Jordan, St. John witnessed that ‘the Heaven was opened. And the Holy Spirit descended in bodily form like a dove upon Him and a voice came from Heaven which said: “You are my beloved Son; in You I am well pleased”

~m~In Jordan River, the Son was in human form, the Holy Spirit in the form of a dove and the Father with His voice were present ~m~

The Lord’s Prayer is addressed to our Father who art in Heaven

Even though Christ addresses the first person of the Holy Trinity as ‘Father’, the Father’s manifestation in the New Testament is only through sound

God is beyond human thought and intellect and is invisible

~m~God the Father also revealed Himself and witnessed the Son during the transfiguration of Jesus on Mount Tabore, saying: “This is My beloved Son, in whom I am well pleased. Hear Him”~m~

The Holy Spirit too is invisible and beyond human intellect. ~m~The Holy Spirit manifested Himself in the form of dove at Jordan, in the form of tongues of fire on the Day of the Pentecost (Acts 2) and in the form of wind in the beginning of creation (Genesis 1:2)~m~

The New Testament writers including St. Paul also taught about the Holy Trinity according to the divine revelations received by them

h2:The Holy Trinity in our Church life
God is one in Essence but three persons

As we sing in the Maneesa of St. Severus
in:Thou wast † crucified for us, ​- Christ, who art our Lord and God; ​
in:Thou didst trample death by death, ​Ending this our death.​
in:Thou art One of Persons three, ​Holy Trinity, ​
in:Worshipped equal praised the same, ​
in:With the Father, and the Holy Ghost

A working definition of two terms is invaluable to our comprehension of the Trinity
ip: Essence (ousia or nature)
ip: Person (hypostasis)

h2:~m~Three Persons in One Essence~m~
God is one in Essence (ousia) yet three, Father, Son and Holy Spirit, in persons (hypostasis)

There is eternally in God true unity, combined with genuinely personal differentiation: the term ‘essence’, ‘substance’, ‘being’ or ‘nature’ indicates the unity, and the term person indicates the differentiation

Father, Son and the Holy Spirit are one in essence, not merely in the sense that all three are examples of the same group or general class (as with human beings), but in the sense that they form a single, unique, specific reality

h2:~m~Communion~m~
The Triune God is a ‘community’. The believers who are joined with Christ through the sacrament of baptism and who live in Christ through the Holy Communion come near to this ‘community’. This is known as Communion. This word indicates our life with the Holy Trinity

The communion with the Holy Trinity is possible only through prayer

We join with Christ through baptism. And through the anointment of the Holy Chrism, the Holy Spirit dwells in us. Thus, we are transformed into children of the Heavenly Father

Each prayer strengthens our relationship with the Holy Trinity

And because you are sons, God has sent forth the Spirit of His Son into your hearts, crying out, “Abba, Father!”. “Therefore, you are no longer a slave but a son, and if a son, then an heir of God through Christ” Gal 4:6-7

Jesus Christ commanded His disciples to baptise all the nations in the name of the Father and of the Son and of the Holy Spirit (Mat 28:19)

The goal of Christ’s Incarnation was to bring mankind, that had drifted away from God the Father because of sin, back into Communion with God. The Holy Baptism and Holy Communion are means of fulfilling this goal

h2:Ch 21. Quiz

1. What does the term "Triune God" mean according to Orthodox Christian theology?
A) Three separate gods working in a coalition
B) One God in three persons (Father, Son, and Holy Spirit) simultaneously
C) One God who changes into three different modes over time
D) Three creation angels appointed over the earth
aa:Answer: B) One God in three persons (Father, Son, and Holy Spirit) simultaneously \n\nThe text defines the Triune God as believing in one God and three distinct persons—Father, Son, and Holy Spirit—who are all completely God at the same time.

2. True or False: Human intellect can fully comprehend and delimit the nature of God using numerals like one or three.
A) True
B) False
aa:Answer: B) False \n\nExplanation: The text explains that God is immeasurable and indefinable; human intellect is only a creation of God, and a creation cannot fully comprehend or delimit the Creator in human terms or numbers.

3. What does the Syriac word Shubaho... translate to in our daily prayers?
A) "Lord, have mercy upon us"
B) "Glory be to the Father, Son and Holy Ghost"
C) "Holy art Thou, O God"
D) "Peace be to you all"
aa:Answer: B) Glory be to the Father, Son and Holy Ghost

4. Which apostolic benediction (also found in 2 Corinthians 13:14) is given by the priest after the celebration of the Sosaffa during the Holy Eucharist?
A) "May the grace of our Lord Jesus Christ be with your spirit."
B) "May the love of God the Father, the grace of the Only Begotten Son and the communion of the Holy Spirit be with you all."
C) "Peace be to the whole world and to the holy Church."
D) "The blessing of the Lord be upon your heads and homes."
aa:Answer: B) May the love of God the Father, the grace of the Only Begotten Son and the communion of the Holy Spirit be with you all.

5. What declaration is made by the congregation immediately after the elevation of the Holy Mysteries ("Holy mysteries, for the Holy and the undefiled")?
A) "One Holy Father, One Holy Son and One living Holy Spirit"
B) "Holy, Holy, Holy, Lord God of Hosts"
C) "Lord have mercy, Lord have mercy, Lord have mercy"
D) "We confess the Nicene Creed"
aa:Answer: A) One Holy Father, One Holy Son and One living Holy Spirit

6. Which Old Testament verse served as the foundational creed of the Jews regarding the oneness of God?
A) Genesis 1:26
B) Deuteronomy 6:4 ("O Israel, listen: Yahweh is our God, Yahweh is one")
C) Psalm 33:6
D) Isaiah 61:1
aa:Answer: B) Deuteronomy 6:4 (O Israel, listen: Yahweh is our God, Yahweh is one)

7. How do Genesis 1:26 ("Let us make man in our image...") and Genesis 1:27 ("So God created man in his own image...") indicate the Holy Trinity in creation?
A) Verse 26 uses the plural form ("us", "our") and Verse 27 uses the singular form ("his"), showing God is three persons and one God simultaneously.
B) They show that angels created man alongside God.
C) They indicate that Adam was created twice in two different bodies.
D) They show that the Old Testament rejects the concept of creation.
aa:Answer: A) Verse 26 uses the plural form (\'us\', \'our\') and Verse 27 uses the singular form (\'his\'), showing God is three persons and one God simultaneously.

8. In Psalm 33:6 ("By the word of the LORD were the heavens made; and all the host of them by the breath of His mouth"), what do "word" and "breath" (rooho) refer to?
A) Two archangels assisting in creation
B) The Son (Word) and the Holy Spirit (Breath/rooho) partaking with the Father in creation
C) Physical wind and spoken human language
D) The Mosaic Law and the Ark of the Covenant
aa:Answer: B) The Son (Word) and the Holy Spirit (Breath/rooho) partaking with the Father in creation

9. True or False: The first manifestation of the Holy Trinity in the New Testament occurred at the birth of Lord Jesus Christ.
A) True
B) False
aa:Answer: B) False \n\nThe first manifestation of the Holy Trinity is at the baptism of Jesus Christ in the River Jordan

10. How were all three Persons of the Holy Trinity uniquely manifested at the Baptism of Jesus Christ in the Jordan River?
A) The Father as fire, the Son as an angel, and the Holy Spirit as light.
B) The Son in human form, the Holy Spirit in the bodily form of a dove, and the Father by His voice from Heaven.
C) All three persons appeared as human travelers on the shore.
D) The Father and Holy Spirit appeared as clouds, while the Son remained invisible.
aa:Answer: B) The Son in human form, the Holy Spirit in the bodily form of a dove, and the Father by His voice from Heaven. \n\n At the Jordan, St. John witnessed the Son being baptized, the Holy Spirit descending as a dove, and the Father speaking from Heaven: \'You are my beloved Son; in You I am well pleased.\'

11. Besides the Baptism at Jordan, at what other New Testament event did God the Father reveal Himself by a voice witnessing to the Son?
A) The Temptation in the Wilderness
B) The Transfiguration of Jesus on Mount Tabor
C) The Resurrection at dawn
D) The Council of Jerusalem
aa:Answer: B) The Transfiguration of Jesus on Mount Tabor \n\nGod the Father revealed Himself during the Transfiguration on Mount Tabor, saying: \'This is My beloved Son, in whom I am well pleased. Hear Him.\'

12. In what three distinct symbolic forms did the Holy Spirit manifest Himself across Salvation history according to the text?
A) Fire in the wilderness, water from the rock, and manna from heaven
B) Wind at the beginning of creation (Gen 1:2), a dove at the Jordan, and tongues of fire on the Day of Pentecost (Acts 2)
C) An olive leaf, a bronze serpent, and a golden censer
D) Rain, thunder, and lightning
aa:Answer: B) Wind at the beginning of creation (Gen 1:2), a dove at the Jordan, and tongues of fire on the Day of Pentecost (Acts 2)

13. Which Greek theological term is used to define the single, shared "Essence", "substance", or "nature" of God?
A) Hypostasis
B) Ousia
C) Diakonos
D) Presbyteros
aa:Answer: B) Ousia \n\nEssence (or nature/substance) as ousia, which indicates the divine unity of the Trinity.

14. Which Greek theological term is used to define the distinct "Person" or personal differentiation within the Holy Trinity?
A) Ousia
B) Hypostasis
C) Episcopos
D) Maniso
aa:Answer: B) Hypostasis \n\n Person as hypostasis, indicating the personal differentiation between Father, Son, and Holy Spirit.

15. How does the relationship between the three Persons of the Holy Trinity differ from three individual human beings?
A) Three humans share one mind, whereas the Trinity has three separate wills.
B) Humans are three examples of a general class, whereas the Father, Son, and Holy Spirit form a single, unique, specific reality of one essence.
C) Humans have no hypostasis, whereas God has only ousia.
D) There is no difference; human relationships are identical to the Trinity.
aa:Answer: B) Humans are three examples of a general class, whereas the Father, Son, and Holy Spirit form a single, unique, specific reality of one essence. \n\nThe Holy Trinity is one in essence not merely as three examples of a group (like humans), but as a single, unique, specific reality.

16. What is the concept of "Communion" in the life of a believer?
A) Attending annual administrative business meetings of the church
B) Living in fellowship with the Triune God 'community', entering near to the Trinity through Baptism, Chrismation, and Holy Qurbana
C) Learning ancient Syriac vocabulary and grammar
D) Paying dues to the local parish council
aa:Answer: B) Living in fellowship with the Triune God \'community\', entering near to the Trinity through Baptism, Chrismation, and Holy Qurbana \n\n The text defines Communion as our life with the Holy Trinity, joining Christ through baptism, receiving the Holy Spirit through Chrismation, and drawing near to the divine community.

17. Scripturally, based on Galatians 4:6–7, what enables believers to cry out "Abba, Father!" as heirs of God?
A) Physical descent from ancient kings
B) Because God has sent forth the Spirit of His Son into our hearts through adoption
C) Wealth and social status in the community
D) Passing academic exams in theology
aa:Answer: B) Because God has sent forth the Spirit of His Son into our hearts through adoption \n\n Galatians 4:6–7: And because you are sons, God has sent forth the Spirit of His Son into your hearts, crying out, \'Abba, Father!\'... no longer a slave but a son, and if a son, then an heir of God through Christ.

18. What Great Commission command did Jesus give to His disciples in Matthew 28:19 regarding the Holy Trinity?
A) "Build tabernacles in every city."
B) "Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit."
C) "Write letters only to individual church leaders."
D) "Observe all Old Testament dietary laws."
aa:Answer: B) Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit.

19. What was the overarching goal of Christ's Incarnation regarding mankind's relationship with God?
A) To make all nations adopt uniform civil governance
B) To bring mankind, which had drifted away from God through sin, back into Communion with God
C) To establish earthly trading posts in Jerusalem
D) To replace all oral prayers with silent meditation
aa:Answer: B) To bring mankind, which had drifted away from God through sin, back into Communion with God \n\n The goal of Incarnation was to restore fallen humanity back into Communion with God the Father, fulfilled through Holy Baptism and Holy Communion.

20. Which option correctly pairs the Greek theological term with its definition in Trinitarian doctrine?
A) Ousia = Person; Hypostasis = Essence
B) Ousia = Essence/Nature (Unity); Hypostasis = Person (Differentiation)
C) Ousia = Song; Hypostasis = Censer
D) Ousia = Deacon; Hypostasis = Bishop
aa:Answer: B) Ousia = Essence/Nature (Unity); Hypostasis = Person (Differentiation) \n\nOusia refers to the single shared Essence/Nature (unity of God), while Hypostasis refers to the distinct Persons (Father, Son, Holy Spirit).


h1:Ch 22 - The Vision of End of Ages
==============================================================================
h2:Introduction
Rev 21:1 - Then I saw a new heaven and a new earth; for the first heaven and the first earth had passed away, and the sea was no more

~m~‘End of Ages’ (i.e. End of this world) will happen during the second coming of our Lord Jesus Christ ~m~

The Last judgement and eternal life are connected with this

In the Nicene creed, we confess our faith in
ip:The Triune God - Father, Son and Holy Spirit
ip:The Holy Church, One Baptism and Eternal life in the world to come
These are the fundamental dogmas of the Church

h2:New Testament - Vision of End of Ages
The importance of End of Ages
in: - The second coming of our Lord Jesus Christ

At the time of Ascension of Christ, two heavenly angels told the disciples
===
ip:Acts 1:11 - “This Jesus, who has been taken up from you into heaven, will so come in like manner as you saw him go into heaven”
===
The Holy Bible ends with the prayer: “Amen. Even so, come Lord Jesus” (Rev 22:20)

The First coming (Birth) of Jesus Christ became a turning point in history, even though many people did not recognise it.

History is divided into BC (Before Christ) and AD (Anno = In the year, Domini = of the Lord) based on the Birth of Jesus Christ. (Also, Read Acts 5:34 About Gamaliel)

The second coming of Christ will be the end of history and the beginning of eternal life

Mark 13:26 - “Then they will see the Son of Man coming in the clouds with great power and glory”. This means that the entire world will see the coming of Jesus Christ

~m~There are about 150 references to the Second Coming of Christ in the New Testament ~m~

~m~The Second Coming of Jesus Christ is often described using the Greek word “Parousia”, which means ‘arrival’ or ‘presence’. This word was used to describe the visit of the emperor or the high officials

~m~So, the second coming of Jesus will be in glory. The entry of Jesus into the Temple of Jerusalem on Palm Sunday is often considered as a sign of the coming of Jesus Christ ~m~

Words like ‘revelation’ and ‘manifestation’ are also used in the New Testament to describe the Second Coming of Jesus Christ
===
ip:During the 2nd coming of Christ, the meaning of life, the state of soul after death and the essence of eternal life will be revealed.
ip:So, these two words indicate that the 2nd coming would reveal things invisible and inscrutable to mankind
===
h2:The Vision of End of Ages & Church Life
When we say that Jesus Christ would come again, it does not mean that today we don’t have His presence in the Church and the world

in:Mat 18:20 “For where two or three are gathered together in My name, I am there in the midst of them”

Jesus Christ is present in all our worship. He is present in the Church as its head, its groom and its shepherd

Christ is present in the life of each believer who has received His sacraments of baptism and Holy Communion and who maintains a live relationship with Jesus Christ

Jesus Christ abides in us as our very life
ip:John 6:54 - Whoever eats my flesh and drinks my blood has eternal life and I will raise him up at the last day
ip:1 John 4:15 - Whoever confesses that Jesus is the Son of God, God abides in him, and he in God
ip:Gal 2:20 - I have been crucified with Christ, and it is no longer I who live, but Christ lives in me

We experience the totality of Christ’s presence and life only at His Second coming

The New Testament exhorts us to pray and live in the hope of His Second coming
ip:We pray ‘Thy kingdom come’ in the Lord’s Prayer with this hope in mind.
We confess our hope in the second coming of Jesus Christ in our Holy Eucharist as well
ip:“We commemorate thy death, O Lord, and confess Thy resurrection, and await Thy Second coming. May Thy blessings be upon us all”
Even though the second coming is a certainty, the New Testament doesn’t specify when that would happen.
ip:Mat 24:42 - “Watch therefore, for you do not know what hour your Lord is coming

Prayer is a sign of awakening. We say each of prayers in hope of the Second coming of Jesus Christ

~m~Jesus Christ has said that his Second coming would be from the east

~m~Mat 24:27 - “For as the lightning comes from the east and flashes to the west, so also will the coming of the Son of Man be”

~m~We say our prayers facing the east and bury our dead with their faces turned eastwards in hope of this second coming from the east~m~

The canonical prayers and the treatises of Church Fathers also contain the hope that Jesus Christ (the Sun of Righteousness - Mal 4:2) would arise in the East at the End of Age

~m~The Church Fathers describe the End of Age ‘as the dawn of Resurrection’, because the Second coming of Christ will be the dawn of a New Age~m~

h2:The End of Age & the Resurrection of the Dead
The most important event during the Second coming would be the Resurrection of the dead

The New Testament gives a detailed description of the Resurrection of the dead at Second Coming
ip:Thess 4:16-17 - For the Lord Himself will descend from heaven with a shout, with the voice of an archangel, and with the trumpet of God. And the dead in Christ will rise first. Then we who are alive and remain shall be caught up together with them in the clouds to meet the Lord in the air
The above passage is read during the Funeral Service of women

There will be the Last Judgement accompanying the resurrection of the dead
ip:John 5:29 - For the hour is coming in which all who are in the graves will hear His voice. And come forth - those who have done good to the resurrection of life and those who have done evil, to the resurrection of condemnation
===
ip:Eternal Life or the life in Heaven would be a life in fellowship with the large community of saintly people
===
ip:When we compare the kingdom of Heaven to a marriage feast, it indicates a life of fellowship (Read - Mat 8:11-12, 22:1-14)
===
At resurrection we will assume a body and a life different from that of today (Read - 1 Cor 15:35-57)

One feature of life in Heaven is incessant worship: “And there shall be no more curse, but the throne of God and of the Lamb shall be in it, and His servants shall serve Him” (Rev 22:3)
ip:The worship of the Church is a pre-sign of the eternal worship in Heaven. Rev 22:4 - “They shall see His face”
ip:What we get through the worship and sacraments of the Church is a foretaste of the eternal life in which we would see the face of God forever

h2:Ch 22. Quiz

B) During the Second Coming of our Lord Jesus Christ
C) At the conclusion of the Council of Nicaea
D) When the Book of Revelation was recorded on Patmos
aa:Answer: B) During the Second Coming of our Lord Jesus Christ \n\n The End of Ages (the end of this world) will happen during the second coming of our Lord Jesus Christ, connected with the Last Judgment and eternal life.

2. Which of the following is not one of the fundamental dogmas confessed in the Nicene Creed according to Chapter 22?

3. What message did two heavenly angels give to the disciples at the Ascension of Jesus Christ (Acts 1:11)?

aa:Answer: B) This Jesus, who has been taken up from you into heaven, will so come in like manner as you saw him go into heaven. \n\n Explanation: Acts 1:11 is cited to show that Christ’s return will be in visible glory, just as the disciples saw Him ascend into heaven.

4. How does the Holy Bible end in Revelation 22:20?

B) "Amen. Even so, come Lord Jesus."

aa:Answer: B) Amen. Even so, come Lord Jesus. \n\nThe Holy Bible concludes with the prayer of hope: \'Amen. Even so, come Lord Jesus\' (Rev 22:20).

5. What do the Latin terms "BC" and "AD" mean in dividing human history around Christ's first coming?

B) BC = Before Christ; AD = Anno Domini (In the year of the Lord)

D) BC = Biblical Era; AD = Apostolic Era
aa:Answer: B) BC = Before Christ; AD = Anno Domini (In the year of the Lord) \n\nHistory is divided based on Christ\'s birth into BC (Before Christ) and AD (Anno = In the year, Domini = of the Lord).

6. True or False: There are approximately 150 references to the Second Coming of Jesus Christ in the New Testament.

B) Parousia

D) Maniso

8. Which entry of Jesus into Jerusalem is considered a sign/foreshadowing of the Second Coming of Jesus Christ?
A) His entry into Bethlehem at His birth
B) His entry into the Temple of Jerusalem on Palm Sunday
C) His flight into Egypt

aa:Answer: B) His entry into the Temple of Jerusalem on Palm Sunday \n\nThe text states that the entry of Jesus into the Temple of Jerusalem on Palm Sunday is often considered a sign of the coming of Jesus Christ in glory.

9. What two words are also used alongside Parousia in the New Testament to indicate that the Second Coming will reveal things previously invisible and inscrutable to mankind?
A) 'Genesis' and 'Exodus'
B) 'Revelation' and 'Manifestation'
C) 'Decree' and 'Statute'
D) 'Sermon' and 'Parable'
aa:Answer: B) Revelation and Manifestation \n\nWords like \'revelation\' and \'manifestation\' are used to describe the 2nd coming because the meaning of life, the state of the soul after death, and eternal life will be revealed.

D) He is present only when paper letters of the Apostles are read aloud.
aa:Answer: B) He is present wherever two or three gather in His name, in all worship, as head/groom/shepherd of the Church, and abiding in believers through Holy Baptism and Holy Communion. \n\n Citing Matthew 18:20, John 6:54, 1 John 4:15, and Galatians 2:20, the text shows that Christ currently abides in believers and worship while we await the fullness of His presence at the Second Coming.

h1:Ch 23 - H.H. Catholicos Baselius Geevarghese II
==============================================================================
h2:Introduction
Till 1876, we had only one metropolitan - known as ‘Metropolitan of Malankara’

He was the only Episcopal and administrative authority in those days

In 1876 six other metropolitans were consecrated

In 1912, the Supreme Head of the Malankara Church adopted the title ‘Catholicos’ and a new administrative system was formed

The modern age of Malankara church history began thereafter

Among these, the Catholicos who reigned for the longest is H.H. Baselius Geevarghese II

In 1947, he proclaimed Mar Gregorios of Parumala and Yeldo Mar Baselius of Kothamangalam as saints of the church

h2:Early Life
Ordained deacon in 1892 and a priest in 1898

On the very 3rd day of his ordination as priest, he took vows of a complete monastic life and was professed ramban

He resided with Parumala Thirumeni, served the saint and also learned the disciplines of monasticism

He visited the Holy land in 1908

On Sep 8, 1912, he was ordained a metropolitan - Geevarghese mar Gregorios

When Parumala Thirumeni passed away on Nov 2, 1912, he was appointed as manager of Parumala Seminary

h2:Catholicos
On Feb 15, 1928, he was chosen as the third Catholicos of Malankara. During this period, he was at the helm of the dioceses of Niranam and Kollam

He founded a Seminary at Kundara, Kollam and caused a great spiritual awakening in that region

When faced with the reformist teachings, the saintly life and authoritative teachings regarding true faith became instrumental in retaining several people in True faith

He published several books - ‘Secret Prayers’, ‘History of Martyrs of the Church’, ‘Penkisa Syrian Offices’, ‘Paradise’ etc.

h2:Malankara Metropolitan
Vattasseril Thirumeni passed away on Feb 23, 1934

The Malankara Christian Association which met on December 25 1934, entrusted the position of Malankara Metropolitan also with the Catholicos

~m~H.H. Geevarghese II became the first Catholicos to hold the twin offices of the Catholicos and the Malankara Metropolitan

~m~The position of Malankara Metropolitan traditionally has been the material authority of the church

~m~The position of the Catholicos founded in 1912 indicates the spiritual authority of the church ~m~ which includes consecration of Metropolitans, consecration of the Holy Chrism and Presiding over the Episcopal Synod

h2:Eternal Rest
Even though these two positions had been held by two different church fathers because of historical reasons, subsequent history proves that the same person holding both these positions has done good for the effective administration

He had been Metropolitan for 52 years, during which he was catholicos for 32 years and held the twin offices for 26 years

He is referred to as Father of Renaissance of Malankara Church


He entered into eternal rest on Jan 3, 1964 aged 90

First Catholicos to be interred at Catholicate Palace, Devalokam, Kottayam, which had been bought by the Church during his tenure

h2:A Great Ascetic
His spiritual rigors and ascetic practices were exemplary. He found in his teacher, St. Gregorios of Parumala, a model for asceticism

He was enthusiastic and vigilant about following prayers of Canonical Hours, Fasts, Fasting and Sacraments. He followed them intensively without a taint of laziness

He had illuminating spiritual experiences, which included hearing God’s answers in his solitary prayer and meditation

As a result, his word and vision became a rich spiritual experience for the believers

His life and observances helped even those who felt inclined towards Reformation, to appreciate the flavours of oriental spirituality

h2:His Powerful Christian Witness
He lived during a period in which Malankara Church was undergoing bitter factional squabbles

Even though several court cases were in progress, he relied on God’s grace in settling the disputes

Hence, he was undaunted when the verdict of 1951 went against him. He emboldened the believers with the optimistic statement “Truth will Triumph”

On the other hand, he extended his love and affection to all of them

When the Supreme Court verdict of 1958 became favourable, he did not feel excessively proud about it

Neither did he belittle or scoff at the opponents

He accepted them into the his fold with Christian love and reigned over the united Church as its High Priest till the end of his life

h2:His Social Recognition and Acceptance
The World Council of which met at Edinburgh in 1937 looked upon him as a great Oriental Father. He earned the earned the attention and recognition of all who attended the meeting

The ‘spiritual glow’ of his countenance attracted several people towards him

He visited the Patriarchs of Alexandria, Yugoslavia and Serbia

Dignitaries such as Ethiopian Emperor Haille Selassie visited the Malankara Church during his tenure

Leaders such as Jawaharlal Nehru showed great love and respect towards himHe elected H.H. Augen I as his successor and passed away in peace and hope aged 89 years on Jan 3, 1964

h2:Ch 23. Quiz

1. Who was the first Catholicos to hold the twin offices of both Catholicos (spiritual authority) and Malankara Metropolitan (material authority)?
A) Vattasseril Mar Dionysius VI
B) H.H. Baselius Geevarghese II
C) H.H. Augen I
D) Parumala Mar Gregorios
aa:Answer: B) H.H. Baselius Geevarghese II \n\n Following the passing of Vattasseril Thirumeni, the Malankara Christian Association entrusted the position of Malankara Metropolitan to Catholicos Baselius Geevarghese II on December 25, 1934, making him the first Catholicos to hold both twin offices.

2. Which two saints of the Church were officially proclaimed by H.H. Baselius Geevarghese II in 1947?

C) St. Severus of Antioch and St. Ephrem
D) St. Thomas and St. James
aa:Answer: B) St. Gregorios of Parumala and St. Yeldo Mar Baselius of Kothamangalam \n\n In 1947, H.H. Baselius Geevarghese II proclaimed Mar Gregorios of Parumala and Yeldo Mar Baselius of Kothamangalam as saints of the church.

3. In Malankara Church history, what distinct roles do the positions of 'Catholicos' and 'Malankara Metropolitan' represent?
A) Catholicos represents local parish administration; Malankara Metropolitan represents overseas missions.

C) Both titles refer strictly to non-monastic lay leaders.
D) Catholicos handles tax collection; Malankara Metropolitan handles Sunday school.
aa:Answer: B) Catholicos indicates spiritual authority (consecrating Metropolitans, Holy Chrism, presiding over Synod); Malankara Metropolitan indicates material/administrative authority.

4. Where is H.H. Baselius Geevarghese II interred following his passing on January 3, 1964?
A) Parumala Seminary
B) Catholicate Palace, Devalokam, Kottayam
C) Manarcad Church
D) Kundara Seminary
aa:Answer: B) Catholicate Palace, Devalokam, Kottayam \n\n H.H. Baselius Geevarghese II was the first Catholicos to be interred at the Catholicate Palace, Devalokam, Kottayam, a property acquired during his tenure.

5. What optimistic declaration did H.H. Baselius Geevarghese II make when the court verdict of 1951 went against him during church litigation?
A) "Victory is Ours"
B) "Truth will Triumph"
C) "Law is Supreme"
D) "Peace be to All"
aa:Answer: B) Truth will Triumph \n\nFacing factional squabbles and an adverse court ruling in 1951, he emboldened the faithful with the statement \'Truth will Triumph,\' which was eventually realized with the favorable 1958 Supreme Court verdict.

6. Which title is commonly attributed to H.H. Baselius Geevarghese II due to his long tenure and transformative leadership of the Malankara Church?
A) Crown of the Syrians
B) Father of Renaissance of Malankara Church
C) Doctor of the Ecumenical Synod
D) Apostle of the East
aa:Answer: B) Father of Renaissance of Malankara Church \n\n Due to his 52 years as Metropolitan (including 32 as Catholicos and 26 holding twin offices), he is celebrated as the \'Father of Renaissance of Malankara Church.\'

7. Who did H.H. Baselius Geevarghese II elect as his successor before entering into eternal rest?
A) Vattasseril Thirumeni
B) H.H. Augen I
C) Mar Severios
D) Parumala Thirumeni
aa:Answer: B) H.H. Augen I \n\nHe elected H.H. Augen I as his successor before passing away in peace on January 3, 1964.

8. Which notable global ecumenical gathering in 1937 recognized H.H. Baselius Geevarghese II as a great Oriental Father?
A) Council of Jerusalem
B) World Council meeting at Edinburgh
C) Synod of Diamper
D) Vatican Council II
aa:Answer: B) World Council meeting at Edinburgh

9. What are the official titles entrusted to the Supreme Head of the Malankara Church, representing both spiritual authority and material/administrative leadership?
A) Marthoma Metropolitan and Archdeacon of All India
B) Catholicos of the East (Spiritual Authority) and Malankara Metropolitan (Material Authority)
C) Metropolitan of Parumala and Metropolitan of Niranam
D) High Priest of Jerusalem and General Administrator of India
aa:Answer: B) Catholicos of the East (Spiritual Authority) and Malankara Metropolitan (Material Authority)


h1:Ch 24 - Fr. Dr. V.C. Samuel
==============================================================================
h2:Introduction
Fr. Dr. V.C. Samuel (1912-1998) was an Indian Christian philosopher, theologian, historian and ecumenical leader

Samuel Achen served as a university professor and a priest of the Indian Orthodox Church

He authored many books and papers including The council of Chalcedon Re-examined: Historical Theological Survey

h2:Studies
His life in Manjanikkara Dayara shaped his vision and perspective of life

After the mortal remains of Patriarch Elias III were interred there, a representative of the Patriarch always resided there

Ramban Abdul Ahad (Later Patriarch Yakub III) thus resided there and had a close association with him

Syrian Patriarchal delegate Elias Mar Yulios enabled Samuel to acquire deep knowledge in Syriac and Hebrew

He acquired mastery of English through his wide reading

Later he mastered several languages such as Greek, Latin, German, Kannada and Tamil

He did his BA in Philosophy, BD and STM (Master of Sacred Theology). He did his Ph.D from Yale University. He also got the fellowship of Rockefeller foundation for Post-Doctoral studies

h2:Works
He enquired into the background of the council of Chalcedon which caused the first split in the Christian Church and the truth behind One Nature, Two Nature theories

~m~His doctoral thesis published as ‘Council of Chalcedon - Re-examined’ ~m~proved that the differences originated because of the Socio-political conditions in those days as both factions did not understand each other

His self-critical book on Malankara Orthodox Church titled ‘is this an Indian Church?’ is the most important book authored by him. He argued that Indian churches should have a national character

He earnestly tried to bridge differences of faith between the churches. ~m~He presented treatises on Ecumenism at four assemblies of the World Council of Churches ~m~ - Evanstone (USA) 1954, New Delhi 1961, Uppsala (Sweden) 1968, Nairobi (Kenya) 1975

He served 23 years in Faith and Order, the theological fellowship of various churches including Roman Catholic Church. He presented papers in 7 assemblies. He gave active leadership to the dialogues between Roman Catholic and Orthodox churches as well as fellowship between Oriental Orthodox Churches and Roman Catholic Church

He also gave active leadership to KCC (Kerala Council of Churches) and NCC (National Council of Churches)

He has written several books and articles

~m~His book on Vattasseril thirumeni titled ‘Truth Triumphs’ was a book with a difference~m~

His autobiography titled ‘On the stage of Own Experiences’ is a sketch of a truthful life

~m~His book ‘Who is Jesus Christ?’ is a peerless work in Christology~m~

He also authored books included in the curriculum of ‘Divyabodhanam’ (Lay Spiritual Education) of Malankara Church

h1:Assignment 1. St. Geevarghese Mar Gregorios of Parumala

h2:Introduction
===============
                ~r~(15 June 1848 – 2 November 1902)

Mat 22:32 I am the God of Abraham, and the God of Isaac, and the God of Jacob? God is not the God of the dead, but of the living

Our worship - angels and departed take part. Everything worships God (Psalm 148)

Job 42:7 And it was so, that after the LORD had spoken these words to Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against you, and against your two friends: for you have not spoken of me the thing that is right, as my servant Job has. 8 Therefore take now seven bulls and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you according to your folly, in that you have not spoken of me the thing which is right, like my servant Job

We do not pray to saints. Prayer is always addressed to The Holy Trinity. We only invoke the saints to pray for us

ip:Popularly known as Parumala Thirumeni / Parumala Kochu Thirumeni
ip:Malankara Orthodox church had no canonization of saints historically
ip:On 2nd Mar 1945, H.H. Baselios Geevarghese II declared Geevarghese Mar Gregorios of Parumala as a saint. On November 2, 1947, Thirumeni was officially canonized as a saint along with Maphrian Yeldho Mar Baselios by the Holy Episcopal Synod
ip:His uncle Rev. Fr. Geevarghese Malpan of Chathuruthy family taught him Syriac Language
ip:14 Sep 1858 - Palakkunnathu Mathews Mar Athanasius ordained him as Korooyo

h3:The six ranks of the diaconate

                        ~r~ Not part of syllabus
